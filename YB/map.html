<style>
  @font-face{
    font-family:"Vitro Core";
    src:url("/fonts/VitroCore.woff2") format("woff2");
    font-weight:400 900; font-style:normal; font-display:swap;
  }
  .banner h1,.cdname,.pbox h3,.apttl{
    font-family:'Vitro Core','Do Hyeon','Noto Serif KR',serif !important;}
  :root{ --map-accent:#1e5230; --map-line:#cfe3d4; --map-soft:#e4f3e7; --map-tip:#f7fbf7; }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 80px;}
  .topbar .inner,.mhead .inner,.banner .binner{max-width:1180px;padding-left:24px;padding-right:24px;}
  /* 배너 — 도쿄 야경 사진 (board.css 에서 지정) */
  .banner{position:relative;overflow:hidden;padding-bottom:0;}
  .banner .binner{position:relative;z-index:3;max-width:1180px;margin:0 auto;
    padding:26px 24px 0;}
  .banner .en{font-family:Georgia,serif;font-style:italic;font-size:13px;letter-spacing:.14em;
    color:#d7ecdd;display:block;margin-bottom:3px;text-shadow:0 1px 10px rgba(0,0,0,.5);}
  .banner h1{font-family:'Noto Serif KR',serif;font-size:27px;font-weight:600;
    color:#f7fcf8;text-shadow:0 2px 16px rgba(0,0,0,.55);margin:0;}
  /* 아래줄 : 왼쪽으로 뻗는 흰 선 — 오른쪽 도쿄 스카이라인 */
  .skyrow{position:relative;z-index:3;max-width:1180px;margin:0 auto;
    padding:0 24px 14px;display:flex;align-items:flex-end;gap:0;margin-top:-6px;}
  .ssline{flex:1;height:3px;background:rgba(255,255,255,.92);border-radius:2px;
    margin-bottom:5px;box-shadow:0 1px 6px rgba(0,0,0,.35);}
  .ssky{flex:none;height:96px;width:auto;display:block;margin-bottom:0;
    filter:brightness(0) invert(1) drop-shadow(0 1px 6px rgba(0,0,0,.45));opacity:.96;}
  @media (max-width:680px){
    .banner .binner{padding:20px 16px 0;}
    .banner h1{font-size:21px;}
    .skyrow{padding:0 16px 12px;gap:0;margin-top:-4px;}
    .ssky{height:60px;} .ssline{height:2px;margin-bottom:3px;}
  }
  .mapnote{margin:22px 0 18px;padding:15px 20px;background:#fff;
    border:1px solid #cfe3d4;border-radius:11px;
    font-size:14.5px;color:#4a463a;line-height:1.7;word-break:keep-all;}
  .mapnote b{color:#2f2a1d;font-weight:600;}
</style>
<script>

          location.replace(location.pathname + "?r=" + v.map);
        }
      }).catch(function () {});
  })();
</script>
