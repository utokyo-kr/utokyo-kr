<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180.png">
<meta name="apple-mobile-web-app-title" content="도쿄대학 한국인 총동문회">
<meta name="application-name" content="도쿄대학 한국인 총동문회">
<meta name="theme-color" content="#0d1c13">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>앨범 | 도쿄대학 한국인학생회</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* 비트로 코어체 — 큰 제목용 */
  @font-face{
    font-family:"Vitro Core";
    src:url("/fonts/VitroCore.woff2") format("woff2");
    font-weight:400 900; font-style:normal; font-display:swap;
  }
  .ahead h1,.rename .rtitle,.lb .cap b{
    font-family:'Vitro Core','Do Hyeon','Noto Serif KR',serif !important;}

  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Sans KR',sans-serif;background:#f6f9f7;color:#243029;-webkit-font-smoothing:antialiased;}
  a{text-decoration:none;color:inherit;}

  .ahead{background:linear-gradient(120deg,#14301f 0%,#1e5230 60%,#2a6b40 100%);color:#fff;
    padding:26px 0 24px;box-shadow:0 2px 10px rgba(0,0,0,.14);}
  .inner{max-width:1180px;margin:0 auto;padding:0 24px;}
  .ahead .en{font-family:'Noto Serif KR',serif;font-style:italic;font-size:12.5px;color:#bfe8c2;letter-spacing:.06em;}
  .ahead h1{font-family:'Noto Serif KR',serif;font-size:26px;font-weight:600;margin-top:5px;line-height:1.35;}
  .ahead .meta{margin-top:9px;font-size:13px;color:rgba(255,255,255,.6);}
  .ahead .back{display:inline-block;margin-top:16px;font-size:13px;color:rgba(255,255,255,.75);
    border:1px solid rgba(255,255,255,.3);border-radius:100px;padding:7px 18px;transition:.2s;}
  .ahead .back:hover{border-color:#bfe8c2;color:#bfe8c2;}
  .ahead .backs{display:flex;gap:8px;flex-wrap:wrap;}

  .awrap{max-width:1180px;margin:0 auto;padding:30px 24px 80px;}
  .addbox{display:none;background:#fff;border:1px solid #dfe9e1;border-radius:10px;
    padding:16px 18px;margin-bottom:22px;box-shadow:0 2px 6px rgba(30,60,40,.06);}
  .addbox.on{display:block;}
  .addbox .ttl{font-size:14px;font-weight:500;color:#1e5230;margin-bottom:12px;}
  .addbox .ttl span{font-weight:300;color:#98a89d;font-size:12.5px;}
  .addbox .fields{display:flex;flex-wrap:wrap;gap:9px;align-items:center;}
  .addbox input{padding:9px 11px;border:1px solid #cfdcd3;border-radius:7px;
    font-family:inherit;font-size:13.5px;background:#fbfefb;color:#243029;}
  .addbox input[type=text]{flex:1;min-width:200px;}
  .addbox .btn{padding:9px 22px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;
    font-family:inherit;border:1px solid #a9cfb4;background:linear-gradient(#f3faf4,#e3f1e7);color:#1e5230;}
  .addbox .btn:disabled{opacity:.5;cursor:default;}
  .addbox .dropzone{margin-top:12px;padding:20px 16px;text-align:center;cursor:pointer;
    border:2px dashed #cfdcd3;border-radius:10px;background:#f4faf5;transition:.15s;}
  .addbox .dropzone:hover,.addbox .dropzone:focus{border-color:#4f9d5d;outline:none;}
  .addbox .dropzone b{display:block;font-size:14px;font-weight:500;color:#1e5230;}
  .addbox .dropzone small{display:block;margin-top:6px;font-size:12.5px;color:#6f7d73;}
  .addbox .dropzone kbd{font-family:inherit;font-size:11.5px;padding:1px 6px;border-radius:4px;
    border:1px solid #cfdcd3;background:#fff;color:#1e5230;}
  .addbox.drop .dropzone{border-color:#4f9d5d;border-style:solid;background:#fff;}
  .addbox .dropzone.ready{border-color:#4f9d5d;border-style:solid;}
  .addbox .amsg{margin-top:10px;font-size:12.5px;color:#6f7d73;}
  .addbox .amsg.err{color:#b3453b;} .addbox .amsg.ok{color:#2f7a45;}

  /* 여러 장 지우기 */
  .rmbar{display:none;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;
    padding:11px 16px;background:#fff;border:1px solid #dfe9e1;border-radius:9px;font-size:13px;color:#3e5344;}
  .rmbar.on{display:flex;}
  .rmbar label{display:flex;align-items:center;gap:7px;cursor:pointer;font-weight:500;}
  .rmbar input[type=checkbox]{width:16px;height:16px;cursor:pointer;}
  .rmbar .note{color:#98a89d;font-size:12px;}
  .rmbar .btn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;
    font-family:inherit;border:1px solid #a9cfb4;background:linear-gradient(#f3faf4,#e3f1e7);color:#1e5230;}
  .rmbar .btn.danger{background:#b3453b;border-color:#b3453b;color:#fff;}
  .rmbar .btn:disabled{opacity:.5;cursor:default;}
  .rmbar .btn.cover{display:none;background:#2f7a45;border-color:#26653a;color:#fff;font-weight:600;}
  .rmbar .btn.cover.on{display:inline-block;}
  /* 고른 사진 옮기기 · 저장 */
  .mvbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;
    padding:13px 16px;background:#f4faf5;border:1px solid #2f7a45;border-radius:10px;font-size:13.5px;}
  .mvbar.on{display:flex;}
  .mvbar b{color:#1e5230;}
  .mvbar select,.mvbar input[type=text]{padding:8px 11px;border:1px solid #dfe9e1;border-radius:7px;
    font-family:inherit;font-size:13.5px;background:#fff;color:#2f2a1d;max-width:230px;}
  .mvbar .btn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;
    font-family:inherit;border:1px solid #dfe9e1;background:#fff;color:#1e5230;}
  .mvbar .btn.go{background:#2f7a45;border-color:#26653a;color:#ffffff;font-weight:600;}
  .mvbar .btn:disabled{opacity:.5;cursor:default;}
  .mvbar .mvmsg{color:#6f7d73;font-size:12.5px;}
  .mvbar .mvmsg.err{color:#b3453b;}
  .rmbar .btn.move{background:#fff;border-color:#2f7a45;color:#1e5230;}
  .rmbar .btn.save{background:#fff;border-color:#dfe9e1;color:#1e5230;}
  .rmbar .btn.move:hover,.rmbar .btn.save:hover{background:#f4faf5;border-color:#2f7a45;}
  .ph.can-pick .pick{display:block;}
  .rmbar .btn.cover:hover{background:#3d9257;}

  .agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .ph{cursor:pointer;position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:8px;
    background:#eef3ef;border:1px solid #dfe9e1;box-shadow:0 2px 5px rgba(30,60,40,.08);transition:.2s;}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:.35s;}
  .ph .dt{position:absolute;left:0;right:0;bottom:0;padding:18px 11px 8px;font-size:12px;color:#fff;
    text-align:right;background:linear-gradient(transparent,rgba(0,0,0,.55));opacity:0;transition:.2s;}
  .ph:hover .dt{opacity:1;}
  .ph:hover{border-color:#7fc48a;box-shadow:0 8px 18px rgba(30,60,40,.18);}
  .ph:hover img{transform:scale(1.06);}
  .ph .rm{position:absolute;top:6px;right:6px;border:none;border-radius:6px;padding:5px 11px;
    font-size:10.5px;cursor:pointer;font-family:inherit;color:#fff;background:rgba(180,60,50,.9);display:none;}
  .ph.can-rm .rm{display:block;}
  .ph .pick{position:absolute;top:6px;left:6px;width:18px;height:18px;cursor:pointer;display:none;z-index:3;}
  .ph.can-rm .pick{display:block;}
  .ph.iscover{outline:3px solid #2f7a45;outline-offset:-3px;}
  .ph .own{position:absolute;left:8px;bottom:8px;z-index:2;max-width:calc(100% - 12px);
    background:rgba(20,54,31,.75);color:#dcf0e2;border-radius:100px;padding:3px 10px;
    font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ph .covmark{display:none;position:absolute;left:30px;top:6px;z-index:3;
    background:#2f7a45;color:#fff;border-radius:100px;padding:3px 10px;
    font-size:10.5px;font-weight:700;white-space:nowrap;}
  .ph.iscover .covmark{display:block;}
  .ph.sel{outline:3px solid #b3453b;outline-offset:-3px;}
  .aempty{padding:60px 0;text-align:center;color:#98a89d;line-height:1.9;}

  /* 확대 보기 */
  .lb{position:fixed;inset:0;background:rgba(8,14,10,.95);display:none;z-index:900;
    align-items:center;justify-content:center;padding:30px;}
  .lb.on{display:flex;}
  .lb img{max-width:100%;max-height:84vh;border-radius:4px;display:block;margin:0 auto;}
  .lb .cap{color:rgba(255,255,255,.72);text-align:center;margin-top:14px;font-size:13.5px;}
  .lb .x{position:absolute;top:20px;right:24px;background:none;border:1px solid rgba(255,255,255,.4);
    color:#fff;border-radius:100px;padding:8px 20px;font-size:13px;cursor:pointer;font-family:inherit;}
  .lb .x:hover{border-color:#bfe8c2;color:#bfe8c2;}
  .lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);color:#fff;width:48px;height:48px;border-radius:100px;
    font-size:22px;cursor:pointer;line-height:1;}
  .lb .nav:hover{background:rgba(255,255,255,.22);}
  .lb .prev{left:22px;} .lb .next{right:22px;}

  @media (max-width:980px){ .agrid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:680px){ .agrid{grid-template-columns:repeat(2,1fr);gap:10px;} .ahead h1{font-size:20px;}
    .lb .nav{width:40px;height:40px;font-size:18px;} .lb .prev{left:8px;} .lb .next{right:8px;} }

  /* 사진마다 좋아요 */
  .ph .like{position:absolute;left:8px;bottom:8px;z-index:4;
    display:inline-flex;align-items:center;gap:4px;padding:3px 9px;
    border:none;border-radius:100px;background:rgba(20,24,34,.55);color:#fff;
    font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;
    backdrop-filter:blur(2px);transition:.15s;}
  .ph .like:hover{background:rgba(20,24,34,.75);}
  .ph .like.on{background:rgba(179,69,59,.85);}
  .ph .like .n{font-variant-numeric:tabular-nums;}

  /* ── 사진 속 얼굴에 이름 ──
     회원은 커서를 얹으면 이름이 뜨고, 운영진은 네모를 둘러 이름을 답니다. */
  #lbstage { position:relative; max-width:1180px; width:100%; }
  .ftlayer { position:absolute; inset:0; pointer-events:none; }
  .ftbox { position:absolute; border:2px solid rgba(255,255,255,.55);
    border-radius:3px; pointer-events:auto; transition:.14s; }
  .ftbox .ftname { position:absolute; left:50%; bottom:-1.7em;
    transform:translateX(-50%); white-space:nowrap; font-size:12px;
    font-weight:600; color:#fff; background:rgba(20,20,20,.82);
    border-radius:4px; padding:2px 8px; opacity:0; transition:.14s;
    pointer-events:none; }
  .ftbox:hover { border-color:#ffd66b; background:rgba(255,214,107,.14); }
  .ftbox:hover .ftname { opacity:1; }
  /* 이름 다는 중에는 네모와 이름이 늘 보입니다 */
  .ft-on .ftbox { border-color:#ffd66b; }
  .ft-on .ftbox .ftname { opacity:1; }
  .ftdel { position:absolute; top:-9px; right:-9px; width:20px; height:20px;
    border:0; border-radius:50%; background:#b3453b; color:#fff; cursor:pointer;
    font-size:11px; line-height:20px; padding:0; }
  .ftsel { position:absolute; border:2px dashed #ffd66b;
    background:rgba(255,214,107,.18); pointer-events:none; }
  .ft-on #lbimg { cursor:crosshair; }

  .ftbar { position:absolute; left:0; top:-42px; }
  .ftgo { border:1px solid rgba(255,255,255,.4); background:rgba(0,0,0,.45);
    color:#fff; border-radius:999px; padding:6px 14px; font:inherit;
    font-size:13px; cursor:pointer; }
  .ftgo:hover { background:rgba(0,0,0,.7); }
  .ftask { position:absolute; left:0; right:0; bottom:-118px;
    background:#fff; border-radius:8px; padding:10px 12px;
    box-shadow:0 10px 30px rgba(0,0,0,.3); z-index:6; }
  .ftask .ftq { width:100%; padding:8px 11px; border:1px solid #ddd;
    border-radius:6px; font:inherit; }
  .fthits { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;
    max-height:96px; overflow:auto; }
  .fthit { border:1px solid #ddd; background:#fff; border-radius:999px;
    padding:4px 11px; font:inherit; font-size:13px; cursor:pointer; }
  .fthit:hover { border-color:#8a6d2b; }
  .fthit em { font-style:normal; font-size:11px; color:#999; margin-left:5px; }
  .ftnone { font-size:12.5px; color:#888; }
  .ftcancel { margin-top:8px; border:0; background:none; color:#888;
    font:inherit; font-size:12.5px; cursor:pointer; }
  .ftmsg { position:absolute; left:0; bottom:-30px; font-size:12.5px;
    color:#ffe9a8; }
  @media (max-width:640px) {
    .ftask { bottom:auto; top:100%; }
    .ftbar { top:-38px; }
  }
</style>
</head>
<body>

<div class="ahead">
  <div class="inner">
    <span class="en">Album</span>
    <h1 id="atitle">불러오는 중…</h1>
    <div class="meta" id="ameta"></div>
    <div class="backs">
      <a class="back" id="aback" href="gallery.html">← 갤러리 목록</a>
      <a class="back" href="index.html">⌂ 학생회 첫화면</a>
      <a class="back" href="/index.html">통합 홈</a>
    </div>
  </div>
</div>

<div class="awrap">
  <div class="addbox" id="addbox">
    <div class="ttl">＋ 이 앨범에 사진 추가 <span id="addWhere"></span></div>
    <div class="fields">
      <input type="file" id="aFiles" accept="image/*" multiple>
      <input type="date" id="aDate">
      <input type="text" id="aCap" maxlength="80" placeholder="설명 (선택)">
      <button class="btn" id="aUp">올리기</button>
    </div>
    <div class="dropzone" id="dropZone" tabindex="0" role="button"
         title="눌러서 사진 고르기 · 끌어다 놓기 · Ctrl+V 로 붙여넣기">
      <b id="dropHint">사진을 여기에 끌어다 놓으세요</b>
      <small>또는 여기를 한 번 누른 뒤 <kbd>Ctrl</kbd>+<kbd>V</kbd> 로 붙여넣기 · 여러 장 한꺼번에 가능</small>
    </div>
    <div class="amsg" id="aMsg"></div>
  </div>

  <div class="rmbar" id="rmbar">
    <label><input type="checkbox" id="pickAll"> 전체 선택</label>
    <span id="pickCnt">선택 0장</span>
    <button class="btn danger" id="rmSel">선택한 사진 지우기</button>
    <button class="btn cover" id="covSel">★ 대표사진으로 지정</button>
    <button class="btn save" id="dlSel">선택한 사진 저장</button>
    <button class="btn move" id="mvOpen" style="display:none;">다른 앨범으로 옮기기</button>
    <span class="note">내가 올린 사진만 지울 수 있습니다. (운영진은 전부)</span>
  </div>

  <!-- 고른 사진을 다른 갈래·앨범으로 (운영진) -->
  <div class="mvbar" id="mvbar">
    <b>옮길 곳</b>
    <select id="mvCat" title="갈래"></select>
    <select id="mvAlb" title="앨범"></select>
    <input type="text" id="mvNew" maxlength="40" placeholder="새 앨범 이름" style="display:none;">
    <button class="btn go" id="mvGo">여기로 옮기기</button>
    <button class="btn" id="mvCancel">취소</button>
    <span class="mvmsg" id="mvMsg"></span>
  </div>

  <div class="agrid" id="agrid"></div>
</div>

<div class="lb" id="lb">
  <button class="x" id="lbx">닫기 ✕</button>
  <button class="nav prev" id="lbp">‹</button>
  <button class="nav next" id="lbn">›</button>
  <div id="lbstage">
    <img id="lbimg" src="" alt="">
    <div class="cap" id="lbcap"></div>
    <p class="ftmsg" id="ftmsg"></p>
  </div>
</div>

<script type="module">
import { CAT_NAME, loadGallery } from "./gallery-lib.js?v=318";
import { sb, currentUser, myProfile, noteActivity } from "/YB/auth/auth.js";
import { loadLikes, toggleLike, heart } from "/YB/auth/likes.js";
import { mountFaces } from "./face-tag.js?v=318";
const ORG = "YB";
{
  const q = new URLSearchParams(location.search);
  const cat = q.get("cat") || "assembly";
  // 총회를 뺀 나머지는 회원만
  {
    let ok = false;
    try { const u = await currentUser(); const me = u ? await myProfile() : null;
          ok = !!(me && (me.approved || me.is_admin)); } catch (e) {}
    if (!ok && cat !== "assembly") {
      document.getElementById("agrid").innerHTML =
        '<div class="aempty" style="grid-column:1/-1;">이 사진첩은 회원만 보실 수 있습니다.<br><br>' +
        '<a class="btn dark" href="/YB/auth/login.html">로그인</a> ' +
        '<a class="btn line" href="/YB/auth/signup.html">회원가입</a></div>';
      throw new Error("member only");
    }
  }
  const id  = q.get("id");
  const { byCat } = await loadGallery();
  const list = byCat[cat] || [];
  const album = list.find(a => a.key === id) || list[0];

  document.getElementById("aback").href = "gallery.html?cat=" + cat;
  if (!album) {
    document.getElementById("atitle").textContent = "앨범을 찾을 수 없습니다.";
    throw new Error("no album");
  }
  document.title = album.title + " | 갤러리";
  document.getElementById("atitle").textContent = album.title;
  document.getElementById("ameta").textContent =
    `${CAT_NAME[cat] || cat} · 사진 ${album.photos.length}장`;

  const esc = s => String(s == null ? "" : s)
    .replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const grid = document.getElementById("agrid");

  /** 사진마다 좋아요 */
  function wireLikes() {
    const btns = [...grid.querySelectorAll("button.like")];
    if (!btns.length) return;
    const paint = (b, on, n) => {
      b.innerHTML = heart(on) + (n ? `<span class="n">${n}</span>` : "");
      b.classList.toggle("on", on);
    };
    loadLikes("photo", btns.map(b => b.dataset.ref)).then(r => {
      btns.forEach(b => paint(b, r.mine.has(b.dataset.ref), r.n[b.dataset.ref] || 0));
    });
    btns.forEach(b => b.addEventListener("click", async (e) => {
      e.preventDefault(); e.stopPropagation();      // 사진이 크게 열리지 않도록
      b.disabled = true;
      const res = await toggleLike("photo", b.dataset.ref, b.classList.contains("on"));
      b.disabled = false;
      if (res) paint(b, res.on, res.n);
    }));
  }
  const draw = () => {
    grid.innerHTML = album.photos.length
      ? album.photos.map((p, i) =>
        `<div class="ph" data-i="${i}" title="${(p.cap || "").replace(/"/g, "&quot;")} (${p.date})">
           <input type="checkbox" class="pick" title="선택">
           <span class="covmark">★ 대표사진</span>
           <button class="rm" title="사진 내리기">✕</button>
           <img src="${p.thumb}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
           ${p.ownerAdmin ? '<span class="own">관리자</span>'
          : (p.ownerName ? `<span class="own">공유자(${esc(p.ownerName)})</span>` : "")}
       <span class="dt">${(p.date || "").replace(/-/g, ".")}</span>
           ${p.id ? `<button class="like" type="button" data-ref="${p.id}">${heart(false)}<span class="n"></span></button>` : ""}
         </div>`).join("")
      : '<div class="aempty" style="grid-column:1/-1;">아직 사진이 없습니다.<br>위에서 사진을 올려주세요.</div>';
    wireLikes();
  };
  draw();

  // 대표사진 표시 (로그인하지 않아도 보이도록)
  grid.querySelectorAll(".ph").forEach(el =>
    el.classList.toggle("iscover", album.photos[+el.dataset.i].key === album.coverKey));



  // ── 사진을 끌어다 놓아 올리기 ──
  //    내 컴퓨터에서 사진 여러 장을 한꺼번에 끌어와도 됩니다.
  {
    const drop = document.getElementById("addbox");
    const files = document.getElementById("aFiles");
    const hint = document.getElementById("dropHint");
    const zone = document.getElementById("dropZone");
    const show = () => {
      const n = files.files.length;
      hint.textContent = n
        ? `사진 ${n}장이 준비됐습니다. 위의 ［올리기］ 를 눌러주세요.`
        : "사진을 여기에 끌어다 놓으세요";
      if (zone) zone.classList.toggle("ready", !!n);
    };
    // 칸을 누르면 파일 고르기 (붙여넣기를 받을 수 있게 여기에 초점도 둡니다)
    if (zone) zone.addEventListener("click", () => { zone.focus(); files.click(); });

    /** 이미 고른 것에 더한다 */
    const addFiles = (list) => {
      const pics = [...list].filter(f => /^image\//.test(f.type));
      if (!pics.length) return 0;
      const dt = new DataTransfer();
      [...files.files].forEach(f => dt.items.add(f));
      pics.forEach(f => dt.items.add(f));
      files.files = dt.files;
      show();
      return pics.length;
    };
    files.addEventListener("change", show);
    show();
    ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, (e) => {
      e.preventDefault(); e.stopPropagation();
      drop.classList.add("drop");
      hint.textContent = "여기에 놓으세요";
    }));
    ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, (e) => {
      e.preventDefault(); e.stopPropagation();
      if (ev === "dragleave" && drop.contains(e.relatedTarget)) return;
      drop.classList.remove("drop");
      show();
    }));
    drop.addEventListener("drop", (e) => {
      if (!addFiles(e.dataTransfer?.files || [])) hint.textContent = "사진 파일만 올릴 수 있습니다.";
    });

    // 붙여넣기(Ctrl+V) — 화면 어디서 눌러도 이 칸으로 들어옵니다.
    //   · 그림을 복사한 경우      → clipboardData.items
    //   · 파일을 복사한 경우      → clipboardData.files
    window.addEventListener("paste", (e) => {
      const cd = e.clipboardData;
      if (!cd) return;
      let got = addFiles(cd.files || []);
      if (!got) {
        const picked = [...(cd.items || [])]
          .filter(x => x.kind === "file" && /^image\//.test(x.type))
          .map(x => x.getAsFile()).filter(Boolean);
        got = addFiles(picked);
      }
      if (!got) return;
      drop.scrollIntoView({ behavior: "smooth", block: "center" });
      e.preventDefault();
    });

    // 창 전체에서 사진을 놓쳤을 때 브라우저가 파일을 열어버리지 않도록
    ["dragover", "drop"].forEach(ev =>
      window.addEventListener(ev, (e) => { if (e.target !== files) e.preventDefault(); }));
  }

  const lb = document.getElementById("lb");
  const img = document.getElementById("lbimg");
  let idx = 0;
  function open(i) {
    if (!album.photos.length) return;
    idx = (i + album.photos.length) % album.photos.length;
    const p = album.photos[idx];
    img.src = p.full;
    document.getElementById("lbcap").textContent =
      `${p.cap || album.title} · ${(p.date || "").replace(/-/g, ".")}` +
      (p.ownerAdmin ? " · 관리자" : p.ownerName ? ` · 공유자(${p.ownerName})` : "") +
      `  (${idx + 1} / ${album.photos.length})`;
    lb.classList.add("on");
    showFaces(p);
  }

  /* ── 사진 속 얼굴에 이름 ──
     회원은 커서를 얹으면 이름이 뜨고, 운영진은 네모를 둘러 이름을 답니다.
     붙박이 사진(자료방에 없는 것)은 이름을 달 수 없습니다. */
  let faceMe = null, faceMembers = null;
  async function showFaces(p) {
    const stage = document.getElementById("lbstage");
    const msg = document.getElementById("ftmsg");
    if (msg) msg.textContent = "";
    if (faceMe === null) {
      try { const u = await currentUser(); faceMe = u ? (await myProfile()) : false; }
      catch (e) { faceMe = false; }
    }
    if (!faceMe || !(faceMe.approved || faceMe.is_admin)) return;
    if (faceMe.is_admin && faceMembers === null) {
      try {
        const r = await sb.from("member_directory")
          .select("name,member_type,faculty,grad_year").order("name");
        faceMembers = (r.data || []).map((m) => ({
          id: null, name: m.name, faculty: m.faculty, grad_year: m.grad_year,
        }));
      } catch (e) { faceMembers = []; }
    }
    /* 그림이 다 뜬 뒤에 얹어야 자리가 맞습니다 */
    if (!img.complete || !img.naturalWidth) {
      await new Promise((ok) => { img.onload = ok; img.onerror = ok; });
    }
    try {
      await mountFaces({
        sb: sb, stage: stage, img: img,
        photoId: (p && p.kind === "db") ? p.id : "",
        org: ORG, isAdmin: !!faceMe.is_admin,
        members: faceMembers || [],
        say: (t) => { if (msg) msg.textContent = t; },
      });
    } catch (e) { /* 얼굴을 못 얹어도 사진은 그대로 보입니다 */ }
  }

  grid.querySelectorAll(".ph").forEach(p => p.addEventListener("click", () => open(+p.dataset.i)));
  document.getElementById("lbx").addEventListener("click", () => lb.classList.remove("on"));
  document.getElementById("lbp").addEventListener("click", e => { e.stopPropagation(); open(idx - 1); });
  document.getElementById("lbn").addEventListener("click", e => { e.stopPropagation(); open(idx + 1); });
  lb.addEventListener("click", e => { if (e.target === lb) lb.classList.remove("on"); });
  document.addEventListener("keydown", e => {
    if (!lb.classList.contains("on")) return;
    if (e.key === "Escape") lb.classList.remove("on");
    if (e.key === "ArrowLeft") open(idx - 1);
    if (e.key === "ArrowRight") open(idx + 1);
  });

  // ─── 회원 : 사진 추가 / 내리기 ───
  try {
    const user = await currentUser();
    const me = user ? await myProfile() : null;
    const isAdmin = !!(me && me.is_admin);
    const myName = (me && me.name) || "";
    if (me && (me.approved || me.is_admin)) {
      const box = document.getElementById("addbox");
      box.classList.add("on");
      document.getElementById("addWhere").textContent = `— ${CAT_NAME[cat]} · ${album.title}`;
      document.getElementById("aDate").value = (album.date || "").slice(0, 10) || `${album.year}-01-01`;

      document.getElementById("aUp").addEventListener("click", async () => {
        const btn = document.getElementById("aUp");
        const msg = document.getElementById("aMsg");
        const files = [...document.getElementById("aFiles").files];
        const date = document.getElementById("aDate").value;
        const capv = document.getElementById("aCap").value.trim();
        if (!files.length) { msg.className = "amsg err"; msg.textContent = "사진을 선택해주세요."; return; }
        if (!date) { msg.className = "amsg err"; msg.textContent = "촬영일을 입력해주세요."; return; }
        btn.disabled = true;
        let ok = 0, fail = 0, last = "";
        for (const [n, f] of files.entries()) {
          msg.className = "amsg"; msg.textContent = `올리는 중… (${n + 1}/${files.length})`;
          const ext = (f.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
          const path = `YB/${cat}/${date}_${Math.random().toString(36).slice(2, 10)}.${ext}`;
          const up = await sb.storage.from("gallery").upload(path, f, { cacheControl: "3600" });
          if (up.error) { fail++; last = up.error.message; continue; }
          const { data: pub } = sb.storage.from("gallery").getPublicUrl(path);
          const ins = await sb.from("gallery_photos").insert({
            category: cat, taken_at: date, caption: capv || null, org: "YB",
            album_key: album.key,          // 지금 열어 놓은 앨범에 그대로 붙입니다
            image_url: pub.publicUrl, storage_path: path,
            sort: album.photos.length + n, created_by: user.id,
            owner_name: isAdmin ? "" : (myName || ""),
            owner_admin: isAdmin,                    // 운영진이 올린 것인지
          });
          if (ins.error) { fail++; last = ins.error.message; } else ok++;
        }
        btn.disabled = false;
        msg.className = "amsg " + (fail ? "err" : "ok");
        msg.textContent = `완료 — 성공 ${ok}장` + (fail ? ` · 실패 ${fail}장 (${last})` : "");
        if (ok) noteActivity("photo", ok);   // 올린 장수만큼
        if (ok) setTimeout(() => location.reload(), 700);
      });

      // 지울 수 있는 사진 표시
      // 네모칸으로 고르기는 승인된 회원이면 누구나 (내려받기에 씁니다)
      const canPick = !!(me && (me.approved || me.is_admin));
      let canRmAny = false;
      grid.querySelectorAll(".ph").forEach(el => {
        const p = album.photos[+el.dataset.i];
        const mine = p.owner && user && p.owner === user.id;
        if (mine || isAdmin) { el.classList.add("can-rm"); canRmAny = true; }
        if (canPick) el.classList.add("can-pick");
      });

      // ── 앨범 대표사진 고르기 ──
      //    사진을 한 장 고른 뒤 윗줄의 ［★ 대표사진으로 지정］ 을 누릅니다.
      //    사진첩을 만든 회원 본인, 또는 운영진만 바꿀 수 있습니다.
      const canCover = isAdmin || !!(album.custom && user && album.owner === user.id);
      const covBtn = document.getElementById("covSel");
      if (canCover) covBtn.classList.add("on");
      const markCover = () => grid.querySelectorAll(".ph").forEach(el =>
        el.classList.toggle("iscover", album.photos[+el.dataset.i].key === album.coverKey));
      markCover();
      covBtn.addEventListener("click", async () => {
        const chosen = [...grid.querySelectorAll(".pick")].filter(c => c.checked);
        if (chosen.length !== 1) {
          alert("대표사진으로 쓸 사진을 한 장만 골라주세요.");
          return;
        }
        const p = album.photos[+chosen[0].closest(".ph").dataset.i];
        covBtn.disabled = true;
        const { error } = await sb.from("gallery_albums").upsert(
          { album_key: album.key, cover_key: p.key, org: "YB" }, { onConflict: "album_key" });
        covBtn.disabled = false;
        if (error) {
          alert("대표사진 지정 실패: " + error.message +
                " — YB/board/sql/gallery_cover.sql 을 실행하셨는지 확인해주세요.");
          return;
        }
        album.coverKey = p.key;
        chosen[0].checked = false;
        chosen[0].dispatchEvent(new Event("change"));
        markCover();
      });

      async function removeMany(photos) {
        const paths = photos.map(p => p.storage_path).filter(Boolean);
        if (paths.length) await sb.storage.from("gallery").remove(paths);
        const { error } = await sb.from("gallery_photos").delete().in("id", photos.map(p => p.id));
        return error ? "삭제 실패: " + error.message : null;
      }

      grid.querySelectorAll(".can-rm .rm").forEach(b => b.addEventListener("click", async (e) => {
        e.stopPropagation();
        const p = album.photos[+b.closest(".ph").dataset.i];
        if (!confirm("이 사진을 삭제할까요?")) return;
        b.disabled = true;
        const err = await removeMany([p]);
        if (err) { alert(err); b.disabled = false; return; }
        location.reload();
      }));

      const picks = [...grid.querySelectorAll(".ph.can-pick .pick, .ph.can-rm .pick")]
        .filter((c, i, a) => a.indexOf(c) === i);
      if (picks.length) {
        document.getElementById("rmbar").classList.add("on");
        // 지울 수 있는 사진이 하나도 없으면 지우기 단추는 감춥니다
        if (!canRmAny) document.getElementById("rmSel").style.display = "none";
        if (isAdmin) document.getElementById("mvOpen").style.display = "";
        const cnt = () => {
          const n = picks.filter(c => c.checked).length;
          document.getElementById("pickCnt").textContent = `선택 ${n}장`;
          picks.forEach(c => c.closest(".ph").classList.toggle("sel", c.checked));
        };
        picks.forEach(c => {
          c.addEventListener("click", (e) => e.stopPropagation());
          c.addEventListener("change", cnt);
        });
        const allBox = document.getElementById("pickAll");
        allBox.addEventListener("change", () => { picks.forEach(c => c.checked = allBox.checked); cnt(); });
        // ── 고른 사진을 내 컴퓨터에 저장 (승인된 회원 누구나) ──
        document.getElementById("dlSel").addEventListener("click", async () => {
          const chosen = picks.filter(c => c.checked)
            .map(c => album.photos[+c.closest(".ph").dataset.i]);
          if (!chosen.length) { alert("저장할 사진을 먼저 골라주세요."); return; }
          const btn = document.getElementById("dlSel");
          btn.disabled = true;
          const base = (album.title || "사진").replace(/[\\/:*?"<>|]/g, "_");
          let ok = 0, fail = 0;
          for (const [n, p] of chosen.entries()) {
            btn.textContent = `저장 중… ${n + 1}/${chosen.length}`;
            const url = p.full || p.thumb;
            const ext = (String(url).split("?")[0].split(".").pop() || "jpg").toLowerCase();
            const name = `${base}_${String(n + 1).padStart(2, "0")}` +
                         (p.date ? `_${p.date.replace(/-/g, "")}` : "") + "." + ext;
            try {
              const res = await fetch(url, { mode: "cors" });
              if (!res.ok) throw new Error(res.status);
              const blob = await res.blob();
              const a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = name;
              document.body.appendChild(a); a.click(); a.remove();
              setTimeout(() => URL.revokeObjectURL(a.href), 4000);
              ok++;
            } catch (e) {
              window.open(url, "_blank", "noopener");   // 막히면 새 창으로 열어 손으로 저장
              fail++;
            }
            await new Promise(r => setTimeout(r, 250));  // 브라우저가 막지 않도록 천천히
          }
          btn.disabled = false; btn.textContent = "선택한 사진 저장";
          if (fail) alert(ok + "장을 저장했습니다.\n" + fail +
            "장은 새 창으로 열었으니 사진 위에서 오른쪽 단추 → " +
            "「이미지를 다른 이름으로 저장」 해주세요.");
        });

        // ── 고른 사진을 다른 갈래·앨범으로 옮기기 (운영진) ──
        //   앨범에 다른 행사 사진이 섞여 들어갔을 때 그것만 골라 빼냅니다.
        if (isAdmin) {
          const mvbar = document.getElementById("mvbar");
          const mvCat = document.getElementById("mvCat");
          const mvAlb = document.getElementById("mvAlb");
          const mvNew = document.getElementById("mvNew");
          const mvMsg = document.getElementById("mvMsg");
          const mvGo  = document.getElementById("mvGo");
          const eq = (s) => String(s || "").replace(/[&<>"]/g,
            c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

          mvCat.innerHTML = CATS.map(([k, v]) =>
            `<option value="${k}"${k === cat ? " selected" : ""}>${v}</option>`).join("");

          const showNew = () => { mvNew.style.display = mvAlb.value === "__new__" ? "" : "none"; };
          const fillAlb = () => {
            const others = (byCat[mvCat.value] || []).filter(a => a.key !== album.key);
            mvAlb.innerHTML = others.map(a =>
              `<option value="${eq(a.key)}">${eq(a.title)} (사진 ${a.photos.length}장)</option>`).join("") +
              '<option value="__new__">＋ 새 앨범 만들기</option>';
            if (!others.length) mvAlb.value = "__new__";
            showNew();
          };
          mvCat.addEventListener("change", fillAlb);
          mvAlb.addEventListener("change", showNew);
          fillAlb();

          document.getElementById("mvOpen").addEventListener("click", () => {
            const n = picks.filter(c => c.checked).length;
            if (!n) { alert("옮길 사진을 먼저 골라주세요."); return; }
            mvbar.classList.add("on");
            mvMsg.className = "mvmsg";
            mvMsg.textContent = `고른 ${n}장을 옮깁니다.`;
            mvbar.scrollIntoView({ behavior: "smooth", block: "center" });
          });
          document.getElementById("mvCancel").addEventListener("click",
            () => mvbar.classList.remove("on"));

          mvGo.addEventListener("click", async () => {
            const chosen = picks.filter(c => c.checked)
              .map(c => album.photos[+c.closest(".ph").dataset.i]);
            if (!chosen.length) { alert("옮길 사진을 먼저 골라주세요."); return; }
            const newCat = mvCat.value;
            let key = mvAlb.value, title = "";
            if (key === "__new__") {
              title = (mvNew.value || "").trim();
              if (!title) {
                mvMsg.className = "mvmsg err";
                mvMsg.textContent = "새 앨범 이름을 적어주세요.";
                mvNew.focus(); return;
              }
            }
            const where = key === "__new__"
              ? `새 앨범 「${title}」`
              : `「${mvAlb.selectedOptions[0].textContent.replace(/ \(사진.*$/, "")}」`;
            if (!confirm(`고른 ${chosen.length}장을 ${CAT_NAME[newCat]} · ${where} 으로 옮길까요?`)) return;

            mvGo.disabled = true; mvGo.textContent = "옮기는 중…";
            const now = new Date().toISOString();
            try {
              if (key === "__new__") {
                // 옮기는 사진 가운데 가장 이른 날짜를 앨범 날짜로 삼습니다
                const d = chosen.map(p => p.date).filter(Boolean).sort()[0]
                       || (album.date || "").slice(0, 10) || null;
                key = "custom:" + (d || "new") + "-" + Math.random().toString(36).slice(2, 7);
                const r = await sb.from("gallery_albums").insert({
                  album_key: key, title, category: newCat, org: "YB", event_date: d,
                  created_by: user.id, updated_by: user.id, updated_at: now,
                });
                if (r.error) throw r.error;
              }
              const dbs = chosen.filter(p => p.kind === "db");
              const statics = chosen.filter(p => p.kind !== "db");
              if (dbs.length) {
                const r = await sb.from("gallery_photos")
                  .update({ category: newCat, album_key: key }).in("id", dbs.map(p => p.id));
                if (r.error) throw r.error;
              }
              if (statics.length) {
                const r = await sb.from("gallery_overrides").upsert(
                  statics.map(p => ({ photo_key: p.key, category: newCat, album_key: key,
                                      updated_by: user.id, updated_at: now })),
                  { onConflict: "photo_key" });
                if (r.error) throw r.error;
              }
            } catch (err) {
              mvMsg.className = "mvmsg err";
              mvMsg.textContent = "옮기지 못했습니다: " + (err.message || err);
              mvGo.disabled = false; mvGo.textContent = "여기로 옮기기";
              return;
            }
            location.href = `album.html?cat=${newCat}&id=${encodeURIComponent(key)}`;
          });
        }

        document.getElementById("rmSel").addEventListener("click", async () => {
          const all = picks.filter(c => c.checked).map(c => album.photos[+c.closest(".ph").dataset.i]);
          // 지우기는 손댈 수 있는 사진만 (본인이 올린 것 · 운영진은 전부)
          const chosen = all.filter(p => isAdmin || (p.owner && user && p.owner === user.id));
          if (!all.length) { alert("지울 사진을 선택해주세요."); return; }
          if (!chosen.length) { alert("고르신 사진은 지우실 수 없습니다. (본인이 올린 사진만 지울 수 있습니다)"); return; }
          if (chosen.length !== all.length &&
              !confirm(`고른 ${all.length}장 가운데 ${chosen.length}장만 지울 수 있습니다. 계속할까요?`)) return;
          if (!confirm(`선택한 ${chosen.length}장을 삭제할까요?`)) return;
          const btn = document.getElementById("rmSel");
          btn.disabled = true; btn.textContent = "처리 중…";
          const err = await removeMany(chosen);
          if (err) { alert(err); btn.disabled = false; btn.textContent = "선택한 사진 지우기"; return; }
          location.reload();
        });
      }
    }
  } catch (e) { /* 무시 */ }
}
</script>

</body>
</html>
