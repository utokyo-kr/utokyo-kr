<style>
  .swrap{max-width:1100px;margin:0 auto;padding:0 24px 70px;}
  .stop{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:34px 0 16px;}
  .stop h2{font-family:'Noto Serif KR',serif;font-size:26px;color:#101d33;font-weight:600;}

  .mine{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;
    background:#e6dfcb;border:1px solid #e6dfcb;border-radius:10px;overflow:hidden;margin-bottom:26px;}
  .mine div{background:#fff;padding:14px 12px;text-align:center;}
  .mine dt{font-size:12px;color:#a09a86;margin-bottom:4px;}
  .mine dd{margin:0;font-size:20px;font-weight:600;color:#101d33;font-variant-numeric:tabular-nums;}
  .mine div.tot{background:#fdf6e6;}
  .mine div.tot dd{color:#8a6d2b;}

  .card2{background:#fff;border:1px solid #e6dfcb;border-radius:10px;padding:20px 22px;margin-bottom:22px;}
  .card2 h3{font-size:16px;font-weight:500;color:#4a3c14;margin-bottom:3px;}
  .card2 .sub{font-size:12.5px;color:#a09a86;margin-bottom:14px;}
  .segs{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .seg{display:inline-flex;border:1px solid #ddd6c4;border-radius:8px;overflow:hidden;}
  .seg a{padding:7px 15px;font-size:13px;font-weight:600;color:#6b6350;cursor:pointer;
    border-right:1px solid #ddd6c4;background:#fff;}
  .seg a:last-child{border-right:none;}
  .seg a.on{background:#c9a961;color:#2b2410;}
  .chart{overflow-x:auto;}
  .chart svg{display:block;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:#7d7768;}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px;}

  table.rank{width:100%;border-collapse:collapse;font-size:14.5px;}
  .rank th,.rank td{padding:11px 12px;text-align:left;border-bottom:1px solid #f2ede2;}
  .rank th{font-size:12.5px;color:#a09a86;font-weight:400;border-bottom:1px solid #e6dfcb;}
  .rank td.no{width:44px;color:#a09a86;font-variant-numeric:tabular-nums;}
  .rank td.nm{font-weight:600;color:#101d33;white-space:nowrap;}
  .rank td.n{text-align:right;font-variant-numeric:tabular-nums;color:#4a4636;white-space:nowrap;}
  .rank td.sc{text-align:right;font-weight:700;color:#8a6d2b;font-variant-numeric:tabular-nums;}
  .rank tr.me{background:#fdf6e6;}
  .rank tr.me td.nm::after{content:" (나)";color:#8a6d2b;font-weight:400;font-size:12px;}
  .rank td.medal{width:34px;font-size:16px;}
  .sempty{padding:44px 20px;text-align:center;color:#8a8574;font-size:15px;line-height:1.9;}
  .sempty a{color:#8a6d2b;border-bottom:1px solid #d8cba8;}
  @media (max-width:700px){ .rank th:nth-child(n+4),.rank td:nth-child(n+4){display:none;}
    .rank th:last-child,.rank td:last-child{display:table-cell;} }

  /* 연도 고르기 — 월별/연별과 다른 빛깔 */
  #yearSeg{border-color:#b6c2d6;}
  #yearSeg a{color:#4a5568;border-right-color:#b6c2d6;}
  #yearSeg a:hover{background:#eef2f8;color:#22304d;}
  #yearSeg a.on{background:#2a3f66;color:#fff;}

  /* 두 단으로 나눈 머리말 */
  .sec2{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    margin:34px 0 12px;padding-bottom:8px;border-bottom:1px solid #e6dfcb;}
  .sec2 h3{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:600;color:#101d33;}
  .sec2 small{font-size:12.5px;color:#7d7768;}
  .sec2:first-child{margin-top:0;}

  /* 그래프 옆 Top 10 */
  .statrow{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;}
  .statrow .chart{flex:1;min-width:320px;}
  .stattop{flex:0 0 240px;max-width:240px;}
  .stattop h4{font-size:13px;font-weight:600;color:#4a3c14;margin-bottom:8px;}
  .stattop ol{list-style:none;counter-reset:t;}
  .stattop li{counter-increment:t;display:flex;align-items:center;gap:8px;
    padding:6px 8px;border-radius:6px;font-size:13px;color:#4a3c14;}
  .stattop li:nth-child(odd){background:#fdf6e6;}
  .stattop li.me{outline:1px solid #c9a961;}
  .stattop li::before{content:counter(t);flex:none;width:18px;text-align:right;
    color:#7d7768;font-size:11.5px;font-variant-numeric:tabular-nums;}
  .stattop li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stattop li .n{flex:none;font-weight:700;font-variant-numeric:tabular-nums;}
  .stattop li .bar{flex:0 0 40px;height:5px;border-radius:3px;background:#e6dfcb;overflow:hidden;}
  .stattop li .bar i{display:block;height:100%;background:#c9a961;}
  .stattop .none{font-size:12.5px;color:#a8a291;padding:10px 2px;}
  .myrank{margin:-14px 0 26px;font-size:13.5px;color:#7d7768;}
  .myrank b{color:#4a3c14;font-size:15px;}
  @media(max-width:820px){ .stattop{flex:1 1 auto;max-width:none;} }

  .mine dt em{font-style:normal;color:#8a6d2b;font-weight:600;}
  .mine .wnote{font-size:12px;color:#a09a86;margin:-18px 0 26px;}

  .mine div.rank2{background:#eef2f8;}
  .mine div.rank2 dd{color:#2a3f66;}
  .mine div.rank2 dd small{display:block;font-size:11.5px;font-weight:400;
    color:#2a3f66;opacity:.75;margin-top:2px;}

  /* 눌러서 펼쳐 보는 칸 */
  .mine div.tap{cursor:pointer;transition:.15s;}
  .mine div.tap:hover{background:#fdf6e6;}
  .mine div.tap.on{background:#fdf6e6;box-shadow:inset 0 -3px 0 #c9a961;}
  .mine div.tap dt::after{content:" ▾";font-size:10px;color:#c9a961;}
  .mine div.tap.on dt::after{content:" ▴";}

  .mylist{display:none;background:#fff;border:1px solid #e6dfcb;border-radius:10px;
    padding:16px 18px;margin:-14px 0 26px;}
  .mylist.on{display:block;}
  .mylist h4{font-size:14px;font-weight:600;color:#4a3c14;margin-bottom:10px;
    display:flex;align-items:center;gap:8px;}
  .mylist h4 .x{margin-left:auto;border:none;background:none;cursor:pointer;
    color:#b0a98f;font-family:inherit;font-size:12px;}
  .mylist h4 .x:hover{color:#8a6d2b;}
  .mylist ul{list-style:none;}
  .mylist li{border-bottom:1px solid #f4f0e8;}
  .mylist li:last-child{border-bottom:none;}
  .mylist li a{display:flex;align-items:baseline;gap:10px;padding:9px 2px;
    font-size:14px;color:#4a3c14;}
  .mylist li a:hover{color:#8a6d2b;}
  .mylist li .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mylist li .cg{flex:none;font-size:11.5px;color:#7d7768;}
  .mylist li .dt{flex:none;font-size:11.5px;color:#b0a98f;font-variant-numeric:tabular-nums;}
  .mylist .none{padding:18px 2px;text-align:center;color:#a8a291;font-size:13.5px;}
  .myshots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
  .myshots a{display:block;border-radius:6px;overflow:hidden;border:1px solid #e6dfcb;}
  .myshots img{width:100%;height:80px;object-fit:cover;display:block;}
  .myshots a:hover{border-color:#c9a961;}

  /* 선물 안내 — 바탕색과 헷갈리지 않게 노란빛으로 도드라지게 */
  .stattop .gift{margin-top:10px;padding:10px 13px;border-radius:8px;
    background:#fff4cf;border:1px solid #eccf72;border-left:4px solid #dfa521;
    font-size:12.5px;line-height:1.6;color:#6b4d06;font-weight:500;}
  .stattop .gift b{color:#a06f08;font-weight:700;}
  /* 오늘 다녀간 사람 */
  .card2.today .tnums{display:flex;flex-wrap:wrap;gap:10px 34px;margin-top:12px;}
  .card2.today .tnums div{display:flex;flex-direction:column;gap:2px;}
  .card2.today .tnums dt{font-size:12.5px;color:#9a947f;letter-spacing:.02em;}
  .card2.today .tnums dd{display:flex;align-items:baseline;gap:3px;}
  .card2.today .tnums b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;}
  .card2.today .tnums span{font-size:12.5px;color:#9a947f;}
  .daystrip{margin-top:18px;padding-top:14px;border-top:1px solid #efe8d8;}
  .daystrip .ds-cap{font-size:12.5px;color:#9a947f;margin-bottom:8px;}
  .daystrip .ds-bars{display:flex;align-items:flex-end;gap:3px;height:48px;}
  .daystrip .ds-bars i{flex:1;min-width:4px;border-radius:2px 2px 0 0;background:#c9ab6b;}
  .daystrip .ds-bars i:hover{background:#8a6d2b;}
  .daystrip .ds-ends{display:flex;justify-content:space-between;gap:10px;
    margin-top:6px;font-size:11.5px;color:#b0a98f;}
  /* 자료방 준비가 아직일 때 알려드리는 줄 */
  .notyet{margin-top:-4px;margin-bottom:10px;padding:8px 12px;border-radius:8px;
    background:#fdf4e3;border:1px solid #ecdcba;color:#8a6d2b;font-size:12.5px;line-height:1.6;}
  .notyet b{font-weight:700;}
  .card2.probe h3 small{font-size:12px;font-weight:400;color:#a8a291;margin-left:8px;}
  .card2.probe table{margin-top:10px;}
</style>

<div class="swrap">

    <h2 id="sTitle">사용통계</h2>
    <span class="cnt" id="sCnt"></span>
  </div>
  <div class="snote" id="sNote">
    홈페이지를 얼마나 함께 쓰고 있는지 보여드립니다.
    <b>같은 소속 동문</b>의 기록만 보이고, 이름 말고 다른 개인정보는 담기지 않습니다.

<script type="module">
import { sb, currentUser, myProfile } from "/OB/auth/auth.js";
import { applyNav, applyAuthLinks } from "/OB/board/nav.js?v=318";

applyNav("OB", "사용통계 | 재한 도쿄대학 총동문회");
applyAuthLinks("OB");

const ORG_NAME = { OB: "재한 도쿄대학 총동문회", YB: "도쿄대학 한국인학생회", GUEST: "비동문 준회원" };
const KIND = [["login", "로그인"], ["visit", "방문"], ["view", "쪽 보기"],
              ["read", "글읽기"], ["comment", "댓글"], ["post", "글쓰기"],
              ["photo", "사진"], ["liked", "좋아요 받음"]];
const KNAME = Object.fromEntries(KIND);
// 그래프 색 — 채도를 낮춘 차분한 여섯 빛깔
const KCOLOR = { login: "#6b83a8", visit: "#c9836a", view: "#8f86b5",
                 read: "#6f9e86", comment: "#c9a961", post: "#b07f92",
                 photo: "#7a6a90", liked: "#c06a6a" };
const CATN = { notice:"공지사항", free:"자유게시판", club:"소모임", mentoring:"멘토멘티", promo:"홍보·채용", condolence:"경조사", forum:"포럼·세미나", qna:"Q&A", jobs:"취업정보", parttime:"아르바이트", market:"벼룩시장", history:"활동 이력", suggest:"동문회에 바란다" };
const KORDER = ["login", "visit", "view", "read", "comment", "post",
                "photo", "liked"];
const esc = (s) => String(s == null ? "" : s)
  .replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const box = document.getElementById("box");

const user = await currentUser();
const me = user ? await myProfile() : null;

if (!me || !(me.approved || me.is_admin)) {
  box.innerHTML = '<div class="sempty">' + (user
    ? "사용통계는 <b>운영진 승인이 끝난 회원</b>만 보실 수 있습니다.<br>(현재: 승인 대기중)"
    : "사용통계는 회원 전용입니다.<br><br>" +
      '<a href="/OB/auth/login.html">로그인</a> · <a href="/OB/auth/signup.html">회원가입</a>') +
    "</div>";
} else {
  start();
}

  /** 오늘 다녀간 사람 — 창구가 아직 없으면 아무것도 그리지 않습니다 */
  function todayCard(t, days) {
    if (!t) return "";
    const n = (v) => Number(v || 0).toLocaleString();
    return `<div class="card2 today">
      <h3>오늘 다녀간 사람</h3>
      <p class="sub">회원이 홈페이지 한 쪽을 열 때마다 셉니다. 로그인하신 분만 세어집니다.</p>
      <dl class="tnums">
        <div><dt>오늘</dt><dd><b>${n(t.today_people)}</b><span>명</span></dd></div>
        <div><dt>오늘 본 쪽</dt><dd><b>${n(t.today_views)}</b><span>번</span></dd></div>
        <div><dt>어제</dt><dd><b>${n(t.yesterday_people)}</b><span>명</span></dd></div>
        <div><dt>이번 주</dt><dd><b>${n(t.week_people)}</b><span>명</span></dd></div>
        <div><dt>이번 달</dt><dd><b>${n(t.month_people)}</b><span>명</span></dd></div>
      </dl>${dayStrip(days)}</div>`;
  }

  /** 최근 30일 — 하루에 몇 분이 다녀가셨는지 */
  function dayStrip(days) {
    if (!days || !days.length) return "";
    const list = days.slice(0, 30).reverse();
    const top = Math.max(...list.map(d => Number(d.people) || 0), 1);
    return `<div class="daystrip">
      <div class="ds-cap">최근 ${list.length}일 — 하루에 다녀가신 분</div>
      <div class="ds-bars">${list.map(d => {
        const n = Number(d.people) || 0;
        return `<i style="height:${Math.max(3, Math.round(n / top * 46))}px"
                   title="${esc(String(d.day))} · ${n}명"></i>`;
      }).join("")}</div>
      <div class="ds-ends"><span>${esc(String(list[0].day))}</span>
        <span>가장 많은 날 ${top}명</span>
        <span>${esc(String(list[list.length - 1].day))}</span></div>
    </div>`;
  }

  /** 자료방 쪽 준비가 아직인지 — 창구에 「쪽 보기」 칸이 없으면 아직입니다 */
  function needSql(rows) {
    return !!(rows && rows.length) && !("view_n" in rows[0]);
  }

async function start() {
  // 이 화면이 어느 단체 것인지는 주소가 정합니다.
  //   운영진은 두 단체를 다 맡으므로, 보는 사람의 소속으로 정하면
  //   학생회 화면에 총동문회 기록이 나오는 일이 생깁니다.
  const org = "OB";
  document.getElementById("sTitle").textContent =
    (ORG_NAME[org] || "") + " 사용통계";

  const [b, m, w, td, dl] = await Promise.all([
    sb.from("activity_board").select("*"),
    sb.from("activity_month").select("*"),
    sb.from("activity_weights").select("kind,weight"),
    // 오늘 다녀간 사람 — 아직 준비 전이면 조용히 넘어갑니다
    sb.from("activity_today").select("*").then(r => r, () => ({ data: null })),
    // 날짜별 다녀간 사람 — 예전 기록도 그대로 셉니다
    sb.from("activity_daily").select("*").order("day", { ascending: false }).limit(120)
      .then(r => r, () => ({ data: null })),
  ]);
  // 활동마다 몇 점으로 세는지 (운영진이 정합니다)
  const WEIGHT = {};
  (w.data || []).forEach(r => { WEIGHT[r.kind] = Number(r.weight); });
  const wOf = (k) => (WEIGHT[k] == null ? 1 : WEIGHT[k]);

  if (b.error || m.error) {
    const err = b.error || m.error;
    box.innerHTML = '<div class="sempty">통계를 불러오지 못했습니다.<br><br>' +
      (/activity_|schema cache/i.test(err.message || "")
        ? "운영진이 <b>auth/activity_stats.sql</b> 을 한 번 실행하면 바로 보실 수 있습니다."
        : esc(err.message)) + "</div>";
    return;
  }

  // 이 화면의 단체 기록만 골라 봅니다 (학생회 화면에는 학생회 회원만)
  const all = (b.data || []).filter(r => r.org === org);
  const months = (m.data || []).filter(r => r.org === org);

  // 내 기록은 따로 챙깁니다 — 운영진처럼 소속이 다른 분도 제 것은 보셔야 하니
  //   거르기 전 자료에서 찾습니다. 순위에서는 운영진인 나를 뺍니다.
  const mine = (b.data || []).find(r => r.is_me);
  const rows = all.filter(r => !(me.is_admin && r.is_me));
  rows.sort((x, y) => (y.score || 0) - (x.score || 0));

  if (!all.length) {
    box.innerHTML = '<div class="sempty">아직 쌓인 기록이 없습니다.<br>' +
      '홈페이지를 쓰실 때마다 하나씩 쌓입니다.</div>';
    return;
  }

  document.getElementById("sCnt").textContent =
    (mine ? `내 점수 ${Math.round(mine.score)}점` : "") +
    (me.is_admin ? "" : (mine ? " · " : "") + `참여하신 분 ${rows.length}명`);

  const myRank = mine ? rows.indexOf(mine) + 1 : 0;

  box.innerHTML =
    (mine ? `<div class="sec2"><h3>내 사용통계</h3>
        <small>내가 홈페이지를 얼마나 썼는지 (가중치 반영)</small></div>
      <dl class="mine">
        ${KIND.map(([k, t]) => {
          const tap = (k === "comment" || k === "post" || k === "photo") && (mine[k + "_n"] || 0) > 0;
          return `<div${tap ? ` class="tap" data-k="${k}"` : ""}>` +
                 `<dt>${t} <em>(${wOf(k)})</em></dt>` +
                 `<dd>${mine[k + "_n"] || 0}</dd></div>`;
        }).join("")}
        <div class="tot"><dt>내 점수</dt><dd>${Math.round(mine.score)}</dd></div>
        ${(() => {
          // 나를 뺀 회원들 사이에서 내가 몇 번째인지 (같은 점수는 같은 등수)
          if (me.is_admin) return `<div class="rank2"><dt>내 순위</dt>
            <dd>—<small>운영진 제외</small></dd></div>`;
          const total = rows.length;
          const rank = rows.findIndex(r => r.is_me) + 1;
          if (!rank || !total) return "";
          const pct = Math.max(1, Math.round(rank / total * 100));
          return `<div class="rank2"><dt>내 순위</dt>
            <dd>${rank}위<small>${total}명 중 상위 ${pct}%</small></dd></div>`;
        })()}
      </dl>
      <div class="mylist" id="myList"></div>`
      : `<div class="sec2"><h3>내 사용통계</h3></div>
         <p class="myrank">아직 쌓인 내 기록이 없습니다. 홈페이지를 쓰시면 하나씩 쌓입니다.</p>`) +
    `<div id="allStats"><div class="sec2"><h3>전체 사용통계 — ${esc(ORG_NAME[org] || "")}</h3>
       <small>우리 쪽 회원 ${rows.length}명이 함께 쓴 기록입니다</small></div>
     ${todayCard(((td && td.data) || []).find(r => r.org === org),
                 ((dl && dl.data) || []).filter(r => r.org === org))}
     <div class="card2">
       <p class="sub">우리 쪽 동문이 홈페이지를 얼마나 쓰셨는지 흐름으로 봅니다.</p>
       <div class="segs">
         <span class="seg" id="modeSeg"><a data-v="month" class="on">월별</a><a data-v="year">연별</a></span>
         <span class="seg" id="yearSeg" style="display:none;"></span>
         <span class="seg" id="kindSeg"></span>
       </div>
       <div class="statrow">
         <div class="chart" id="chart"></div>
         <div class="stattop" id="statTop"></div>
       </div>
       <div class="legend"></div>
     </div>
     <div class="card2">
       <h3>많이 참여하신 분</h3>
       <p class="sub" id="rankSub">활동을 점수로 더한 순서입니다. 위 그래프에서 달·해를 누르면 그 기간만 봅니다.</p>
       ${needSql(all) ? '<p class="notyet">「쪽 보기」는 아직 세지 않습니다 — ' +
          '운영진이 <b>auth/activity_every_view.sql</b> 을 한 번 실행하면 그때부터 쌓입니다.</p>' : ""}
       <div style="overflow-x:auto;"><table class="rank" id="rank"></table></div>
     </div></div>`;

  // ── 순위 ──
  //   기간을 고르지 않으면 지금까지 모두, 고르면 그 달·해만 봅니다.
  //   (기간별 수치는 activity_month 를 사람별로는 알 수 없으므로 전체 순위를 그대로 보여드립니다)
  /** 고른 분야로 많이 하신 분 열 분 (전체 기간) */
  function drawTop() {
    const el = document.getElementById("statTop");
    if (!el) return;
    const one = kind !== "all" && kind !== "each" ? kind : "";
    const list = rows
      .map(r => ({ nm: r.name, me: r.is_me, n: one ? (r[one + "_n"] || 0) : Math.round(r.score) }))
      .filter(x => x.n > 0)
      .sort((x, y) => y.n - x.n)
      .slice(0, 10);
    const label = one ? (KNAME[one] || "") : "총점";
    const top = list.length ? list[0].n : 1;
    el.innerHTML = `<h4>${label} Top 10</h4>` +
      (list.length
        ? "<ol>" + list.map(x => `<li class="${x.me ? "me" : ""}">` +
            `<span class="nm">${esc(x.nm)}</span>` +
            `<span class="bar"><i style="width:${Math.round(x.n / top * 100)}%;"></i></span>` +
            `<span class="n">${x.n}</span></li>`).join("") + "</ol>"
        : '<div class="none">아직 기록이 없습니다.</div>') +
      '<p class="gift">분야별 <b>1등</b>에게는 <b>총회 때 선물을 드립니다.</b></p>';
  }

  function drawRank() {
    const sub = document.getElementById("rankSub");
    if (sub) sub.textContent = pick
      ? `${mode === "month" ? pick.replace("-", ".") : pick + "년"} 기준으로 보고 계십니다. ` +
        "아래 순위는 지금까지 쌓인 전체 기록입니다."
      : "활동을 점수로 더한 순서입니다. 위 그래프에서 달·해를 누르면 그 기간만 봅니다.";

    const use = kind === "all" ? null : kind;
    const list = rows.slice().sort((x, y) =>
      use ? (y[use + "_n"] || 0) - (x[use + "_n"] || 0) : (y.score || 0) - (x.score || 0));

    document.getElementById("rank").innerHTML =
      "<thead><tr><th></th><th>이름</th>" +
      KIND.map(([k, t]) =>
        `<th style="text-align:right;${use === k ? "color:#8a6d2b;font-weight:700;" : ""}">${t}</th>`).join("") +
      `<th style="text-align:right;${!use ? "color:#8a6d2b;font-weight:700;" : ""}">점수</th></tr></thead><tbody>` +
      list.slice(0, 30).map((r, i) => `<tr class="${r.is_me ? "me" : ""}">
        <td class="${i < 3 ? "medal" : "no"}">${i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1}</td>
        <td class="nm">${esc(r.name)}</td>
        ${KIND.map(([k]) => `<td class="n">${r[k + "_n"] || 0}</td>`).join("")}
        <td class="sc">${Math.round(r.score)}</td>
      </tr>`).join("") + "</tbody>";
  }

  // ── 그래프 ──
  let mode = "month", kind = "all", pick = "";
  let year = String(new Date().getFullYear());   // 월별에서 보고 있는 해
  const kindSeg = document.getElementById("kindSeg");
  kindSeg.innerHTML = '<a data-v="all" class="on">전체(쌓기)</a><a data-v="each">분야별</a>' +
    KIND.map(([k, t]) => `<a data-v="${k}">${t}</a>`).join("");

  document.querySelectorAll("#modeSeg a").forEach(a => a.addEventListener("click", () => {
    mode = a.dataset.v;
    pick = "";
    document.querySelectorAll("#modeSeg a").forEach(x => x.classList.toggle("on", x === a));
    drawYears();
    draw();
  }));
  kindSeg.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {
    kind = a.dataset.v;
    kindSeg.querySelectorAll("a").forEach(x => x.classList.toggle("on", x === a));
    draw();
    drawTop();
    drawRank();
  }));

  function bucket() {
    const g = new Map();
    months.forEach(r => {
      const k = mode === "month" ? r.ym : String(r.ym).slice(0, 4);
      if (!g.has(k)) g.set(k, { n: 0, p: 0, by: {} });
      const b = g.get(k);
      b.by[r.kind] = (b.by[r.kind] || 0) + Number(r.n || 0);
      if (kind === "all" || kind === "each" || r.kind === kind) {
        b.n += Number(r.n || 0);
        b.p = Math.max(b.p, Number(r.people || 0));
      }
    });
    return [...g.entries()].sort((a, b2) => a[0].localeCompare(b2[0]))
      .map(([k, v]) => ({ k, n: v.n, p: v.p, by: v.by }));
  }

  /** 월별은 고른 해의 1월~12월 열두 칸, 연별은 첫 해부터 올해까지 */
  function fillGaps(arr) {
    const now = new Date();
    const have = new Map(arr.map(d => [d.k, d]));
    const blank = (k) => ({ k, n: 0, p: 0, by: {} });
    const out = [];
    if (mode === "month") {
      for (let m = 1; m <= 12; m++) {
        const k = year + "-" + String(m).padStart(2, "0");
        out.push(have.get(k) || blank(k));
      }
    } else {
      const first = arr.length ? +arr[0].k.slice(0, 4) : now.getFullYear();
      for (let y = first; y <= now.getFullYear(); y++) out.push(have.get(String(y)) || blank(String(y)));
    }
    return out;
  }

  /** 기록이 있는 해들 — 월별에서 고를 수 있게 */
  function drawYears() {
    const box = document.getElementById("yearSeg");
    if (!box) return;
    box.style.display = mode === "month" ? "inline-flex" : "none";
    if (mode !== "month") return;
    const now = new Date().getFullYear();
    const first = months.length
      ? Math.min(...months.map(r => +String(r.ym).slice(0, 4))) : now;
    const ys = [];
    for (let y = first; y <= now; y++) ys.push(String(y));
    box.innerHTML = ys.map(y =>
      `<a data-y="${y}"${y === year ? ' class="on"' : ""}>${y}년</a>`).join("");
    box.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {
      year = a.dataset.y; pick = ""; drawYears(); draw(); drawRank();
    }));
  }

  function draw() {
    const data = fillGaps(bucket()).slice(mode === "month" ? -24 : -12);
    const el = document.getElementById("chart");
    const lg = document.querySelector(".legend");
    if (!data.length) {
      el.innerHTML = '<div class="sempty">이 활동은 아직 기록이 없습니다.</div>';
      if (lg) lg.innerHTML = "";
      return;
    }
    const wide = kind === "all" || kind === "each";
    const W = Math.max(560, data.length * (mode === "month" ? (kind === "each" ? 62 : 46) : 80));
    const H = 240, PAD = 38, BOT = 34, TOP = 14;
    const step = (W - PAD * 2) / data.length;
    const zero = H - BOT;

    const heightOf = (d) =>
      kind === "all"  ? KORDER.reduce((n, k) => n + (d.by[k] || 0), 0)
    : kind === "each" ? Math.max(...KORDER.map(k => d.by[k] || 0), 0)
    :                   Math.max(d.n, d.p);
    const top = Math.max(1, ...data.map(heightOf));
    const y = (v) => zero - (v / top) * (zero - TOP);

    const grid = [0, 0.5, 1].map(f => {
      const v = Math.round(top * f), yy = y(v);
      return `<line x1="${PAD}" y1="${yy}" x2="${W - PAD}" y2="${yy}" stroke="#efe9db"/>` +
             `<text x="${PAD - 8}" y="${yy + 4}" text-anchor="end" font-size="10"
                fill="#a09a86">${v}</text>`;
    }).join("");

    const bar = (x, w, v, fill, title, dim) => {
      if (!v) return "";
      const h = zero - y(v), r = Math.min(4, w / 2, h), yy = y(v);
      return `<path d="M${x} ${zero} L${x} ${yy + r} Q${x} ${yy} ${x + r} ${yy}` +
             ` L${x + w - r} ${yy} Q${x + w} ${yy} ${x + w} ${yy + r} L${x + w} ${zero} Z"` +
             ` fill="${fill}" opacity="${dim ? .4 : 1}"><title>${title}</title></path>`;
    };

    const bars = data.map((d, i) => {
      const x0 = PAD + step * i;
      const label = mode === "month" ? d.k.slice(2).replace("-", ".") : d.k;
      const dim = pick && pick !== d.k;
      let body = "";

      if (kind === "all") {
        const bw = Math.min(30, step * 0.5);
        const x = x0 + (step - bw) / 2;
        let acc = 0;
        body = KORDER.map(k => {
          const v = d.by[k] || 0;
          if (!v) return "";
          const yTop = y(acc + v), yBot = y(acc);
          acc += v;
          return `<rect x="${x}" y="${yTop}" width="${bw}" height="${Math.max(1, yBot - yTop - 2)}"
                    rx="2" fill="${KCOLOR[k]}" opacity="${dim ? .4 : 1}">
                    <title>${d.k} · ${KNAME[k]} ${v}</title></rect>`;
        }).join("");

      } else if (kind === "each") {
        const gap = 2;
        const bw = Math.max(3, (step * 0.86 - gap * 5) / 6);
        const x = x0 + (step - (bw * 6 + gap * 5)) / 2;
        body = KORDER.map((k, n) =>
          bar(x + n * (bw + gap), bw, d.by[k] || 0, KCOLOR[k],
              `${d.k} · ${KNAME[k]} ${d.by[k] || 0}`, dim)).join("");

      } else {
        const bw = Math.min(24, step * 0.36);
        const cx = x0 + step / 2;
        body = bar(cx - bw - 1, bw, d.n, KCOLOR[kind] || "#6b83a8",
                   `${d.k} · ${KNAME[kind] || ""} ${d.n}`, dim) +
               bar(cx + 1, bw, d.p, "#b3aca0", `${d.k} · ${d.p}명`, dim);
      }

      return `<rect class="pickbar" data-k="${d.k}" x="${x0}" y="0" width="${step}"
                height="${zero}" fill="${pick === d.k ? "rgba(0,0,0,.045)" : "transparent"}"
                style="cursor:pointer;"/>` + body +
             `<text x="${x0 + step / 2}" y="${zero + 15}" text-anchor="middle"
                font-size="10.5" fill="#a09a86">${label}</text>`;
    }).join("");

    el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="${mode === "month" ? "월별" : "연별"} 사용통계 막대그래프">${grid}
      <line x1="${PAD}" y1="${zero}" x2="${W - PAD}" y2="${zero}" stroke="#efe9db"/>
      ${bars}</svg>`;

    if (lg) lg.innerHTML = wide
      ? KORDER.map(k => `<span><i style="background:${KCOLOR[k]};"></i>${KNAME[k]}</span>`).join("")
      : `<span><i style="background:${KCOLOR[kind] || "#6b83a8"};"></i>${KNAME[kind] || ""} 수</span>` +
        '<span><i style="background:#9aa3ad;"></i>사람 수</span>';

    el.querySelectorAll(".pickbar").forEach(r => r.addEventListener("click", () => {
      pick = (pick === r.dataset.k) ? "" : r.dataset.k;
      draw(); drawRank();
    }));
  }


  // ── 내가 쓴 댓글 · 글 · 올린 사진 펼쳐 보기 ──
  {
    const TAPS = { comment: "내가 쓴 댓글", post: "내가 쓴 글", photo: "내가 올린 사진" };
    const listEl = document.getElementById("myList");
    let open = "";
    const cache = {};

    const paint = () => document.querySelectorAll(".mine div.tap")
      .forEach(d => d.classList.toggle("on", d.dataset.k === open));

    async function fetchMine(kind) {
      if (cache[kind]) return cache[kind];
      if (kind === "post") {
        const r = await sb.from("posts")
          .select("id,title,category,created_at")
          .eq("author_id", user.id).order("created_at", { ascending: false }).limit(200);
        cache[kind] = r.error ? { err: r.error } : { rows: r.data || [] };
      } else if (kind === "comment") {
        const r = await sb.from("comments")
          .select("id,post_id,content,created_at")
          .eq("author_id", user.id).order("created_at", { ascending: false }).limit(200);
        if (r.error) { cache[kind] = { err: r.error }; }
        else {
          const rows = r.data || [];
          // 어느 글에 단 댓글인지 제목을 함께 가져옵니다
          const ids = [...new Set(rows.map(x => x.post_id))].filter(Boolean);
          let title = {};
          if (ids.length) {
            const t = await sb.from("posts").select("id,title").in("id", ids);
            (t.data || []).forEach(p => { title[p.id] = p.title; });
          }
          cache[kind] = { rows: rows.map(x => ({ ...x, ptitle: title[x.post_id] || "" })) };
        }
      } else {
        const r = await sb.from("gallery_photos")
          .select("id,image_url,category,taken_at,album_key")
          .eq("created_by", user.id).order("taken_at", { ascending: false }).limit(300);
        cache[kind] = r.error ? { err: r.error } : { rows: r.data || [] };
      }
      return cache[kind];
    }

    function draw(kind, got) {
      const head = `<h4>${TAPS[kind]} <span style="font-weight:400;color:#a8a291;">` +
                   `${got.rows ? got.rows.length + "건" : ""}</span>` +
                   '<button class="x" id="myClose">닫기 ✕</button></h4>';
      if (got.err) {
        listEl.innerHTML = head + '<div class="none">불러오지 못했습니다: ' + esc(got.err.message) + "</div>";
      } else if (!got.rows.length) {
        listEl.innerHTML = head + '<div class="none">아직 없습니다.</div>';
      } else if (kind === "photo") {
        listEl.innerHTML = head + '<div class="myshots">' + got.rows.map(p =>
          `<a href="/OB/album.html?cat=${esc(p.category)}` +
          `&id=${encodeURIComponent(p.album_key || "")}" title="${(p.taken_at || "").slice(0, 10)}">` +
          `<img src="${esc(p.image_url)}" alt="" loading="lazy"></a>`).join("") + "</div>";
      } else if (kind === "post") {
        listEl.innerHTML = head + "<ul>" + got.rows.map(p =>
          `<li><a href="/OB/post.html?id=${p.id}">` +
          `<span class="tt">${esc(p.title)}</span>` +
          `<span class="cg">${esc(CATN[p.category] || p.category)}</span>` +
          `<span class="dt">${(p.created_at || "").slice(0, 10)}</span></a></li>`).join("") + "</ul>";
      } else {
        listEl.innerHTML = head + "<ul>" + got.rows.map(c =>
          `<li><a href="/OB/post.html?id=${c.post_id}">` +
          `<span class="tt">${esc((c.content || "").replace(/\s+/g, " ").slice(0, 60))}</span>` +
          `<span class="cg">${esc((c.ptitle || "").slice(0, 20))}</span>` +
          `<span class="dt">${(c.created_at || "").slice(0, 10)}</span></a></li>`).join("") + "</ul>";
      }
      const x = document.getElementById("myClose");
      if (x) x.addEventListener("click", () => { open = ""; paint(); listEl.classList.remove("on"); });
    }

    document.querySelectorAll(".mine div.tap").forEach(d => d.addEventListener("click", async () => {
      const kind = d.dataset.k;
      if (open === kind) { open = ""; paint(); listEl.classList.remove("on"); return; }
      open = kind; paint();
      listEl.classList.add("on");
      listEl.innerHTML = '<div class="none">불러오는 중…</div>';
      draw(kind, await fetchMine(kind));
      listEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }));
  }

  try { drawYears(); draw(); drawTop(); drawRank(); }
  catch (e) {
    const c = document.getElementById("chart");
    if (c) c.innerHTML = '<div class="sempty">아직 그릴 기록이 없습니다.</div>';
  }
}

  /* ── 운영진 전용 : 기록이 실제로 쌓이는지 그 자리에서 봅니다 ──
     자료방을 직접 들여다봅니다. SQL 을 따로 돌리지 않으셔도 됩니다. */
  (async () => {
    let me = null;
    try { me = await myProfile(); } catch (e) {}
    if (!me || !me.is_admin) return;

    const wrap = document.createElement("div");
    wrap.className = "card2 probe";
    wrap.innerHTML = '<h3>기록 점검 <small>운영진만 보입니다</small></h3>' +
                     '<p class="sub">읽어보는 중…</p>';
    const host = document.getElementById("allStats") || document.getElementById("box");
    if (host) host.appendChild(wrap);

    const { data, error } = await sb.from("activity_events")
      .select("kind,at,ref,user_id").order("at", { ascending: false }).limit(400);
    if (error) {
      wrap.innerHTML = '<h3>기록 점검</h3><p class="sub">들여다보지 못했습니다 — ' +
        esc(error.message) + '</p>';
      return;
    }
    const by = {};
    (data || []).forEach(r => {
      if (!by[r.kind]) by[r.kind] = { n: 0, last: "" };
      by[r.kind].n++;
      if (r.at > by[r.kind].last) by[r.kind].last = r.at;
    });
    const when = (s) => (s || "").replace("T", " ").slice(0, 16);
    const kinds = ["login", "visit", "view", "read", "comment", "post", "photo", "liked"];
    wrap.innerHTML =
      '<h3>기록 점검 <small>운영진만 보입니다</small></h3>' +
      '<p class="sub">가장 최근 ' + (data || []).length + '건을 들여다본 것입니다. ' +
      '「쪽 보기」 줄에 숫자가 붙고 시각이 방금이면 제대로 쌓이는 것입니다.</p>' +
      '<table class="rank"><thead><tr><th>활동</th><th class="n">최근 건수</th>' +
      '<th>마지막</th></tr></thead><tbody>' +
      kinds.map(k => {
        const d = by[k] || { n: 0, last: "" };
        const hot = k === "view" || k === "visit";
        return '<tr><td' + (hot ? ' style="font-weight:700;"' : '') + '>' +
               esc(KNAME[k] || k) + '</td><td class="n">' + d.n + '</td><td>' +
               (d.last ? esc(when(d.last)) : "—") + '</td></tr>';
      }).join("") + '</tbody></table>' +
      '<p class="sub" style="margin-top:10px;">최근 8건 — ' +
      (data || []).slice(0, 8).map(r =>
        esc((KNAME[r.kind] || r.kind) + " " + when(r.at))).join(" · ") + '</p>';
  })();
</script>

</body>
</html>
