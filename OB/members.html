<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180.png">
<meta name="apple-mobile-web-app-title" content="도쿄대학 한국인 총동문회">
<meta name="application-name" content="도쿄대학 한국인 총동문회">
<meta name="theme-color" content="#0d1c13">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 명부 | 재한 도쿄대학 총동문회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/OB/board/board.css?v=318">
<style>
  .mwrap{max-width:1100px;margin:0 auto;padding:0 24px 70px;}
  .mtop{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:34px 0 18px;}
  .mtop h2{font-family:'Noto Serif KR',serif;font-size:26px;color:#101d33;font-weight:600;}
  .mtop .cnt{font-size:13.5px;color:#8a8574;}
  .mnote{background:#f9f5ea;border:1px solid #eee6d2;border-radius:9px;padding:12px 16px;
    font-size:13px;color:#6f6a5c;margin-bottom:20px;line-height:1.7;}
  .orgseg{display:inline-flex;border:1px solid #ddd6c6;border-radius:10px;overflow:hidden;
    margin-bottom:16px;}
  .orgseg a{padding:9px 18px;font-size:13.5px;font-weight:600;color:#6b6350;cursor:pointer;
    border-right:1px solid #ddd6c6;background:#fff;}
  .orgseg a:last-child{border-right:none;}
  .orgseg a:hover{background:#faf7ef;color:#3f3a29;}
  .orgseg a.on{background:#c9a961;color:#2b2410;}
  .orgseg a.on.yb{background:#1e5230;color:#fff;}
  #scopeNote{display:block;margin-top:6px;color:#8a8574;}
  .msrch{display:flex;gap:9px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
  .msrch input{flex:1;min-width:220px;padding:11px 16px;border:1px solid #ddd6c6;border-radius:100px;
    font-family:inherit;font-size:14.5px;background:#fff;color:#2f2a1d;outline:none;}
  .msrch input:focus{border-color:#c9a24b;}
  .msrch .clr{border:1px solid #ddd6c6;background:#fff;cursor:pointer;font-family:inherit;
    font-size:13.5px;color:#7d7768;padding:10px 18px;border-radius:100px;}

  table.mlist{width:100%;border-collapse:collapse;background:#fff;
    border:1px solid #e6dfcb;border-radius:10px;overflow:hidden;}
  .mlist th,.mlist td{padding:13px 14px;text-align:left;border-bottom:1px solid #f2ede2;font-size:15px;}
  .mlist th{background:#faf7ef;font-size:13px;color:#8a8574;font-weight:400;cursor:pointer;user-select:none;}
  .mlist th:hover{color:#8a6d2b;}
  .mlist th .arr{font-size:10px;color:#c3bca8;margin-left:4px;}
  .mlist tr:last-child td{border-bottom:none;}
  .mlist tbody tr:hover{background:#fdfaf2;}
  .mlist td.nm{font-weight:600;color:#101d33;white-space:nowrap;}
  .mlist td.fa{color:#4a4636;}
  .mlist td.yr{color:#8a8574;white-space:nowrap;}
  .mlist td.no{color:#c3bca8;}
  .mempty{padding:52px 20px;text-align:center;color:#8a8574;font-size:15px;line-height:1.9;}
  .mempty a{color:#8a6d2b;border-bottom:1px solid #d8cba8;}
  @media (max-width:640px){ .mlist th:nth-child(3),.mlist td:nth-child(3){display:none;} }
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="links">
      <a href="/index.html">⌂ 통합 홈</a>
      <a href="https://www.u-tokyo.ac.jp/en/" target="_blank" rel="noopener">도쿄대학 홈페이지</a>
      <a href="/YB/index.html">한국인학생회</a>
      <a href="https://alumni.tokyoksa.com/" target="_blank" rel="noopener">총동문회 홈페이지(기존)</a>
    </div>
    <div class="links" id="authLinks">
      <a href="/OB/auth/login.html">로그인</a>
      <a href="/OB/auth/signup.html">회원가입</a>
      <a href="/OB/auth/find.html">아이디·비번 찾기</a>
    </div>
  </div>
</div>

<header class="mhead">
  <div class="inner">
    <a class="mlogo" href="/OB/index.html">재한 도쿄대학 총동문회<small>在韓東京大学総同門会 · EST. 2011</small></a>
    <nav></nav>
    <div class="mpills"></div>
  </div>
</header>

<div class="mwrap">
  <div class="mtop">
    <h2>회원 명부</h2>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="mnote">
    동문 여러분끼리 보시는 명부입니다. <b>이름 · 전공 · 연도</b>만 담았고,
    <b>전화번호와 이메일은 담지 않습니다.</b> 연락이 필요하시면 운영진에게 말씀해주세요.
    <span id="scopeNote"></span>
  </div>

  <div class="orgseg" id="orgseg" style="display:none;"></div>

  <div class="msrch" id="srch" style="display:none;">
    <input type="text" id="q" placeholder="이름이나 전공으로 찾기">
    <button class="clr" id="clr">지우기</button>
  </div>

  <div id="box"><div class="mempty">불러오는 중…</div></div>
</div>

<script type="module">
import { sb, currentUser, myProfile } from "/OB/auth/auth.js";
import { applyNav, applyAuthLinks } from "/OB/board/nav.js?v=318";

applyNav("OB", "회원 명부 | 재한 도쿄대학 총동문회");
applyAuthLinks("OB");

const esc = (s) => String(s == null ? "" : s)
  .replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const box = document.getElementById("box");

const user = await currentUser();
const me = user ? await myProfile() : null;

if (!me || !(me.approved || me.is_admin)) {
  box.innerHTML = '<div class="mempty">' + (user
    ? "회원 명부는 <b>운영진 승인이 끝난 회원</b>만 보실 수 있습니다.<br>(현재: 승인 대기중)"
    : "회원 명부는 회원 전용입니다.<br><br>" +
      '<a href="/OB/auth/login.html">로그인</a> · <a href="/OB/auth/signup.html">회원가입</a>') +
    "</div>";
} else {
  // 명부는 자료방에서 이미 갈라 내보냅니다.
  //   일반 회원 → 제 소속만 / 운영진 → 양쪽 모두
  const { data, error } = await sb.from("member_directory")
    .select("name,member_type,faculty,grad_year").order("name");

  if (error) {
    box.innerHTML = '<div class="mempty">명부를 불러오지 못했습니다.<br><br>' +
      (/member_directory|schema cache/i.test(error.message || "")
        ? "운영진이 <b>auth/member_directory.sql</b> 을 한 번 실행하면 바로 보실 수 있습니다."
        : esc(error.message)) + "</div>";
  } else {
    const all = data || [];
    let key = "name", dir = 1, kw = "";
    document.getElementById("srch").style.display = "flex";

    const NAME = { OB: "총동문회(OB)", YB: "학생회(YB)", GUEST: "비동문 준회원" };
    const isAdmin = !!me.is_admin;
    // 운영진만 양쪽을 오갑니다. 일반 회원에게는 단추가 아예 없습니다.
    let scope = isAdmin ? "OB" : (me.member_type || "OB");
    if (isAdmin) {
      const seg = document.getElementById("orgseg");
      seg.style.display = "inline-flex";
      const kinds = ["OB", "YB"].concat(all.some(r => r.member_type === "GUEST") ? ["GUEST"] : []);
      seg.innerHTML = kinds.map(k =>
        `<a data-o="${k}"${k === "YB" ? ' class="yb"' : ""}>${NAME[k]}</a>`).join("") +
        '<a data-o="all">전체</a>';
      seg.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {
        scope = a.dataset.o; paintSeg(); draw();
      }));
      document.getElementById("scopeNote").textContent =
        "운영진이시라 양쪽을 모두 보실 수 있습니다. 일반 회원에게는 제 소속만 보입니다.";
    } else {
      document.getElementById("scopeNote").textContent =
        `${NAME[scope] || "소속"} 동문만 보입니다.`;
    }
    function paintSeg() {
      document.querySelectorAll("#orgseg a").forEach(a =>
        a.classList.toggle("on", a.dataset.o === scope));
    }
    paintSeg();

    const rowsNow = () => scope === "all" ? all : all.filter(r => r.member_type === scope);

    const val = {
      name: r => (r.name || "").trim(),
      faculty: r => (r.faculty || "").trim(),
      grad: r => (r.grad_year || "").trim(),
      org: r => (r.member_type || "").trim(),
    };

    function draw() {
      const q = kw.toLowerCase();
      const rows = rowsNow();
      const list = rows.filter(r => !q ||
        (r.name || "").toLowerCase().includes(q) ||
        (r.faculty || "").toLowerCase().includes(q) ||
        (r.grad_year || "").toLowerCase().includes(q));

      const v = val[key];
      list.sort((a, b) => {
        const x = v(a), y = v(b);
        if (!x && y) return 1;
        if (x && !y) return -1;
        return x.localeCompare(y, "ko") * dir;
      });

      document.getElementById("cnt").textContent =
        kw ? `‘${kw}’ 찾기 · ${list.length}명 (모두 ${rows.length}명)` : `모두 ${rows.length}명`;

      if (!list.length) {
        box.innerHTML = '<div class="mempty">찾으시는 동문이 없습니다.</div>';
        return;
      }
      const th = (k, t) => `<th data-k="${k}">${t}<span class="arr">${key === k ? (dir > 0 ? "▲" : "▼") : "⇅"}</span></th>`;
      const wide = scope === "all";
      box.innerHTML = '<table class="mlist"><thead><tr>' +
        th("name", "이름") + (wide ? th("org", "구분") : "") +
        th("faculty", "학부 · 연구과") + th("grad", "졸업(예정)연도") +
        "</tr></thead><tbody>" +
        list.map(r => `<tr>
          <td class="nm">${esc(r.name) || '<span class="no">-</span>'}</td>
          ${wide ? `<td class="yr">${esc(NAME[r.member_type] || r.member_type || "-")}</td>` : ""}
          <td class="fa">${esc(r.faculty) || '<span class="no">-</span>'}</td>
          <td class="yr">${esc(r.grad_year) || '<span class="no">-</span>'}</td>
        </tr>`).join("") + "</tbody></table>";

      box.querySelectorAll("th[data-k]").forEach(h => h.addEventListener("click", () => {
        if (key === h.dataset.k) dir = -dir; else { key = h.dataset.k; dir = 1; }
        draw();
      }));
    }

    const q = document.getElementById("q");
    q.addEventListener("input", () => { kw = q.value.trim(); draw(); });
    document.getElementById("clr").addEventListener("click", () => { q.value = ""; kw = ""; draw(); });
    draw();
  }
}
</script>

</body>
</html>
