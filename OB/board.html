<style>
  /* 비회원 안내 — 갈래 단추 옆에 나란히 */
  #loginNotice{display:none;align-items:center;gap:6px;flex-wrap:wrap;
    margin-left:auto;padding:9px 15px;border-radius:9px;font-size:12.5px;line-height:1.5;
    background:#fff8e6;border:1px solid #f0d79a;color:#6b5520;}
  #loginNotice.on{display:inline-flex;}
  #loginNotice b{font-weight:600;}
  #loginNotice a{display:inline;padding:0;margin:0;border:0;background:none;box-shadow:none;
    color:#6b5520;font-weight:700;font-size:12.5px;border-bottom:1px solid currentColor;
    border-radius:0;transform:none;}
  #loginNotice a:hover{opacity:.7;}
  @media (max-width:900px){ #loginNotice{margin:10px 0 0;width:100%;} }
  /* 키워드 검색 */
  .srch{display:flex;gap:9px;align-items:center;margin:30px 0 20px;flex-wrap:wrap;}
  .srch .box{flex:1;min-width:240px;display:flex;align-items:center;gap:9px;background:#fff;
    border:1px solid #ddd6c6;border-radius:100px;padding:4px 6px 4px 20px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 3px rgba(60,50,20,.1), 0 5px 12px rgba(60,50,20,.12);
    transition:.18s;}
  .srch .box:focus-within{border-color:#c9a24b;box-shadow:0 4px 8px rgba(60,50,20,.14), 0 12px 24px rgba(60,50,20,.16);}
  .srch input{flex:1;border:0;outline:0;background:transparent;font-family:inherit;
    font-size:15px;color:#2f2a1d;padding:11px 0;}
  .srch input::placeholder{color:#a8a291;font-weight:300;}
  .srch .go{flex:none;border:0;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:600;
    padding:10px 24px;border-radius:100px;background:#101d33;color:#fff;transition:.18s;}
  .srch .go:hover{background:#1c2f52;}
  .srch .clr{display:none;flex:none;border:1px solid #ddd6c6;background:#fff;cursor:pointer;
    font-family:inherit;font-size:13.5px;color:#7d7768;padding:10px 18px;border-radius:100px;}
  .srch .clr.on{display:inline-block;}
  .srchmsg{margin:-8px 0 18px;font-size:13.5px;color:#7d7768;}
  .srchmsg b{color:#101d33;}
  body.yb .srch .go{background:#1e5230;} body.yb .srch .go:hover{background:#2f7a45;}
  body.yb .srch .box:focus-within{border-color:#7fc48a;}
  body.yb .srchmsg b{color:#1e5230;}
  @media (max-width:680px){ .srch .go{padding:10px 18px;} }

  /* ── 게시판 배너 : 책상 그림 (좌우가 다 들어오게, 위아래만 잘라냄) ── */
  .banner{
    /* 폭은 꽉 채우고(좌우 안 잘림), 넘치는 아래쪽만 잘라낸다.
       화면이 아주 넓어도 그림이 지나치게 커지지 않게 1500px 에서 멈춘다. */
    /* 그림 비율(5.66:1) 그대로 배너 높이를 잡아, 좌우도 위아래도 한 점 안 잘린다 */
    background:#f4eee5 url('/OB/images/ob_board_desk2.jpg?v=318') center/contain no-repeat;
    color:#2f2a20;
    aspect-ratio:2169/383;height:auto;min-height:88px;
    display:flex;align-items:flex-start;
  }
  /* 제목은 머리줄 로고와 같은 열에.
     flex 안에서 margin:0 auto 를 쓰면 글자가 가운데로 밀려나므로,
     왼쪽 여백으로 자리를 잡는다 */
  .banner .binner{width:100%;max-width:none;margin:0;
    padding-top:18px;padding-bottom:0;padding-right:24px;
    padding-left:max(24px, calc((100% - 1180px) / 2 + 24px));}
  @media (max-width:680px){ .banner .binner{padding-top:12px;padding-left:16px;padding-right:16px;} }
  .banner .en{color:#9a7b28;text-shadow:0 1px 2px rgba(255,255,255,.7);}
  .banner h1{color:#2f2a20;text-shadow:0 1px 3px rgba(255,255,255,.75);}
  @media (max-width:680px){ .banner{min-height:104px;} }
</style>
</head>
