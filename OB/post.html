<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180.png">
<meta name="apple-mobile-web-app-title" content="도쿄대학 한국인 총동문회">
<meta name="application-name" content="도쿄대학 한국인 총동문회">
<meta name="theme-color" content="#0d1c13">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>게시글 | 재한 도쿄대학 총동문회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/OB/board/board.css?v=318">
<style>
  .pshare{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:18px 0 6px;
    padding:13px 18px;background:#fff;border:1px solid #e6dfcb;border-radius:11px;}
  body.yb .pshare{border-color:#cfe3d4;}
  .pshare .stx{font-size:13px;color:#8b8474;margin-right:2px;}
  .pshare .btn.sh{padding:9px 18px;border-radius:8px;font-size:13.5px;font-weight:600;
    cursor:pointer;font-family:inherit;border:1px solid transparent;color:#fff;transition:.16s;}
  .pshare .btn.sh:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .pshare .btn.band{background:#22b573;border-color:#1c9c62;}
  .pshare .btn.fb{background:#1877f2;border-color:#1465ce;}
  .pshare .btn.copy{background:#fff;border-color:#ddd6c4;color:#5a5648;}
  .pshare .smsg{font-size:12.5px;color:#2f7a45;}
</style>
</head>
<body>


<div class="topbar">
  <div class="inner">
    <div class="links">
      <a href="/index.html">⌂ 통합 홈</a>
      <a href="https://www.u-tokyo.ac.jp/en/" target="_blank" rel="noopener">도쿄대학 홈페이지</a>
      <a href="/YB/index.html">한국인학생회</a>
      <a href="https://alumni.tokyoksa.com/" target="_blank" rel="noopener">총동문회 홈페이지(기존)</a>

    </div>
    <div class="links" id="authLinks"><a href="/OB/auth/login.html">로그인</a><a href="/OB/auth/signup.html">회원가입</a><a href="/OB/auth/find.html">아이디·비번 찾기</a></div>
  </div>
</div>

<header class="mhead">
  <div class="inner">
    <a class="mlogo" href="/OB/index.html">재한 도쿄대학 총동문회<small>在韓東京大学総同門会 · EST. 2011</small></a>
    <nav></nav>
    <div class="mpills"></div>
  </div>
</header>

<div class="banner">
  <div class="binner">
    <span class="en">Community Board</span>
    <h1>게시판</h1>
  </div>
</div>

<div class="wrap">
  <div class="post" id="postBox">
    <div class="empty">불러오는 중…</div>
  </div>
  <div class="pshare" id="share">
    <span class="stx">이 글을 다른 곳에도 알리시려면</span>
    <button class="btn sh band" id="shBand">밴드에 공유</button>
    <button class="btn sh fb" id="shFb">페이스북에 공유</button>
    <button class="btn sh copy" id="shCopy">주소 복사</button>
    <span class="smsg" id="shMsg"></span>
  </div>

  <div class="pactions" id="actions" style="display:none;">
    <button class="btn line" id="editBtn">수정</button>
    <button class="btn line" id="delBtn">삭제</button>
  </div>

  <!-- 댓글 -->
  <div class="cmt-wrap" id="cmtWrap" style="display:none;">
    <h3 class="cmt-title">댓글 <span id="cmtCount">0</span></h3>
    <div id="cmtList"></div>
    <div id="cmtFormBox">
      <textarea id="cmtInput" placeholder="댓글을 입력하세요"></textarea>
      <div style="text-align:right;margin-top:8px;">
        <button class="btn dark" id="cmtSubmit">댓글 등록</button>
      </div>
      <div class="msg" id="cmtMsg"></div>
    </div>
  </div>
</div>

<script type="module">
import { initPost } from "/OB/board/post-core.js?v=318";
initPost("OB");
</script>

</body>
</html>
