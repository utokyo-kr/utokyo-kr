<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180.png">
<meta name="apple-mobile-web-app-title" content="도쿄대학 한국인 총동문회">
<meta name="application-name" content="도쿄대학 한국인 총동문회">
<meta name="theme-color" content="#0d1c13">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 정보 | 도쿄대학 한국인 총동문회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=318">
</head>
<body>

<div class="card">
  <h1>내 정보</h1>
  <p class="desc" id="statusLine">불러오는 중…</p>

  <form id="editForm" style="display:none;">
    <label>이름 *</label>
    <input type="text" id="f_name" required>

    <label>구분</label>
    <select id="f_type" disabled>
      <option value="YB">YB — 재학생 (한국인학생회)</option>
      <option value="OB">OB — 졸업생 (재한 도쿄대학 총동문회)</option>
      <option value="GUEST">비동문 — Guest (도쿄대학 출신이 아닌 분)</option>
    </select>
    <p class="fixnote">구분은 운영진이 정합니다. 졸업하셨거나 잘못 되어 있으면
      <a href="mailto:tokyoksa.president@gmail.com">tokyoksa.president@gmail.com</a> 으로 알려 주세요.</p>

    <div class="row2">
      <div>
        <label>학부/연구과</label>
        <input type="text" id="f_faculty">
      </div>
      <div>
        <label>졸업(예정)연도</label>
        <input type="text" id="f_grad">
      </div>
    </div>

    <div id="jobBox">
      <label style="margin-bottom:2px;">현직 소속 · 직위</label>
      <p id="jobHint" style="display:none;font-size:12.5px;line-height:1.6;color:#8a6d2b;
         background:#faf5e8;border:1px solid #efe4cc;border-radius:8px;
         padding:8px 11px;margin:2px 0 8px;">
        처음 가입하실 때는 이 칸이 없었습니다. 지금 채워 주시면 동문 명부에 함께 실립니다.
      </p>
      <div class="row2">
        <div><input type="text" id="f_company" placeholder="소속 (회사·기관·대학)"></div>
        <div><input type="text" id="f_position" placeholder="직위 (예: 부장 · 교수 · 연구원)"></div>
      </div>
    </div>

    <label>전화번호</label>
    <input type="tel" id="f_phone" placeholder="010-0000-0000">

    <label>이메일 <span style="font-weight:300;color:#9a947f;">(변경 불가)</span></label>
    <input type="email" id="f_email" disabled style="background:#f2efe8;color:#8a8574;">

    <label>승인 상태</label>
    <div id="f_status" style="padding:4px 0;"></div>

    <button class="primary" id="saveBtn" type="submit">수정 내용 저장</button>
    <div class="msg" id="msg"></div>
  </form>

  <button class="primary" id="goSite" style="display:none;background:#8a6d2b;">홈페이지로 이동</button>
  <button class="ghost" id="logoutBtn">로그아웃</button>
  <div class="back" style="text-align:center;"><a href="/index.html">← 통합 홈으로</a></div>
</div>

<script type="module">
import { sb, currentUser, myProfile, logout, showMsg } from "./auth.js";

document.getElementById("logoutBtn").addEventListener("click", logout);

const user = await currentUser();
if (!user) {
  location.href = "login.html";
} else {
  const p = await myProfile();
  const st = document.getElementById("statusLine");
  if (!p) {
    st.textContent = "프로필을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.";
  } else {
    st.textContent = (p.name || "회원") + "님, 가입 정보를 확인하고 수정하실 수 있습니다.";
    document.getElementById("f_name").value = p.name || "";
    // 구분(총동문회 · 학생회 · 비동문)은 본인이 바꾸지 못합니다.
    // 게시판을 어디까지 보실 수 있는지가 여기서 갈리므로, 운영진이 회원관리에서 정합니다.
    document.getElementById("f_type").value =
      ["YB", "OB", "GUEST"].includes(p.member_type) ? p.member_type : "OB";
    document.getElementById("f_faculty").value = p.faculty || "";
    document.getElementById("f_grad").value = p.grad_year || "";
    document.getElementById("f_company").value = p.company || "";
    // 재학생(YB)에게는 직장·직급을 묻지 않는다
    const jobBox = document.getElementById("jobBox");
    const typeSel = document.getElementById("f_type");
    const toggleJob = () => { jobBox.style.display = typeSel.value === "YB" ? "none" : ""; };
    typeSel.addEventListener("change", toggleJob);
    toggleJob();
    document.getElementById("f_position").value = p.job_title || "";
    // 옛 회원은 이 두 칸이 비어 있습니다 — 그때만 안내를 보여드립니다
    if (!(p.company || "").trim() && !(p.job_title || "").trim()) {
      document.getElementById("jobHint").style.display = "block";
    }
    document.getElementById("f_phone").value = p.phone || "";
    document.getElementById("f_email").value = p.email || user.email;
    document.getElementById("f_status").innerHTML = p.approved
      ? '<span class="badge ok">승인 완료 — 정회원</span>'
      : '<span class="badge wait">운영진 승인 대기중</span>';
    document.getElementById("editForm").style.display = "block";
    // 회원 구분에 맞는 홈페이지로 (학생회 회원이면 학생회 홈으로)
    {
      const go = document.getElementById("goSite");
      const home = (p.member_type === "YB") ? "/YB/index.html" : "/OB/index.html";
      go.textContent = (p.member_type === "YB")
        ? "도쿄대학 한국인학생회 홈페이지로" : "재한 도쿄대학 총동문회 홈페이지로";
      go.addEventListener("click", () => { location.href = home; });
      go.style.display = "block";
    }

    document.getElementById("editForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("saveBtn");
      const msg = document.getElementById("msg");
      btn.disabled = true;
      const { error } = await sb.from("profiles").update({
        name: document.getElementById("f_name").value.trim(),
        faculty: document.getElementById("f_faculty").value.trim(),
        grad_year: document.getElementById("f_grad").value.trim(),
        company: document.getElementById("f_company").value.trim(),
        job_title: document.getElementById("f_position").value.trim(),
        phone: document.getElementById("f_phone").value.trim(),
      }).eq("id", user.id);
      btn.disabled = false;
      if (error) showMsg(msg, "저장 실패: " + error.message);
      else showMsg(msg, "저장되었습니다.", true);
    });
  }
}
</script>

</body>
</html>
