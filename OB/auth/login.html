  <h1>로그인</h1>
  <p class="desc">회원 전용 콘텐츠는 로그인 후 이용하실 수 있습니다.</p>

  <form id="loginForm">
    <label>이메일</label>
    <input type="email" id="email" required placeholder="you@example.com">
    <label>비밀번호</label>
    <input type="password" id="password" required>
    <label style="display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-weight:400;cursor:pointer;">
      <input type="checkbox" id="keep" checked style="width:auto;margin:0;">
      <span>로그인 상태 유지 <small style="color:#9a947f;">(이 브라우저에서 계속 로그인된 상태로 두기)</small></span>
    </label>
    <button class="primary" id="btn" type="submit">로그인</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="foot"><a href="find.html">아이디 · 비밀번호 찾기</a></div>
  <div class="foot">아직 회원이 아니신가요? <a href="signup.html">회원가입</a></div>
  <div class="back" style="text-align:center;"><a href="/index.html">← 통합 홈으로</a></div>
</div>

<script type="module">
import { sb, showMsg, currentUser } from "./auth.js";
import { noteLogin } from "./auth.js";

// 로그인 뒤에 돌아갈 곳 — ?next= 가 있으면 그곳, 없으면 보던 화면, 그것도 없으면 통합 홈
function backTo() {
  const q = new URLSearchParams(location.search).get("next");
  const pick = (u) => {
    if (!u) return null;
    try {
      const t = new URL(u, location.origin);
      if (t.origin !== location.origin) return null;      // 우리 홈페이지 안에서만
      if (/\/auth\/(login|signup)\.html/.test(t.pathname)) return null;
      return t.pathname + t.search + t.hash;
    } catch (e) { return null; }
  };
  return pick(q) || pick(document.referrer) || "/index.html";
}
const NEXT = backTo();

// 이미 로그인 상태면 굳이 로그인 화면을 보여주지 않는다
currentUser().then(u => { if (u) location.href = NEXT; });

const form = document.getElementById("loginForm");
const btn = document.getElementById("btn");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  btn.disabled = true;
  // 체크 해제 시에는 창을 닫으면 로그아웃되도록 표시해 둔다
  try { localStorage.setItem("utokyo-keep", document.getElementById("keep").checked ? "1" : "0"); } catch (e) {}
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value,
  });
  btn.disabled = false;
  if (error) {
    const m = error.message.includes("Invalid login")
      ? "이메일 또는 비밀번호가 올바르지 않습니다."
      : error.message.includes("Email not confirmed")
      ? "이메일 인증이 아직 완료되지 않았습니다. 받은편지함의 인증 메일을 확인해주세요."
      : "로그인 실패: " + error.message;
    showMsg(msg, m);
  } else {
    await noteLogin();         // 로그인 횟수·월별 통계에 한 줄 남긴다
    location.href = NEXT;      // 내 정보는 위 메뉴의 [내 정보] 에서 언제든 고칠 수 있습니다
  }
});
</script>
