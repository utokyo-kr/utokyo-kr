  <h1>아이디 · 비밀번호 찾기</h1>
  <p class="desc">가입하실 때 적으신 <b>이름</b>과 <b>휴대전화</b>를 넣어주세요.</p>

  <form id="findForm">
    <label>이름</label>
    <input type="text" id="name" required placeholder="홍길동" autocomplete="name">
    <label>휴대전화</label>
    <input type="tel" id="phone" required placeholder="010-1234-5678" autocomplete="tel">
    <button class="primary" id="btn" type="submit">아이디 찾기</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="found" id="found">
    회원님의 아이디(이메일)는<br>
    <b id="foundEmail"></b> 입니다.
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid #cfe3d4;">
      <label style="display:block;font-weight:500;margin-bottom:6px;">새 비밀번호
        <small style="color:#7d8a80;font-weight:400;">(6자 이상 · 쓰시던 것과 같아도 됩니다)</small></label>
      <input type="password" id="np1" minlength="6" autocomplete="new-password"
             style="width:100%;box-sizing:border-box;">
      <label style="display:block;font-weight:500;margin:10px 0 6px;">다시 한 번</label>
      <input type="password" id="np2" minlength="6" autocomplete="new-password"
             style="width:100%;box-sizing:border-box;">
      <button class="primary" id="setpw" style="margin-top:12px;">이 비밀번호로 바꾸기</button>
      <div style="margin-top:10px;font-size:12.5px;color:#7d8a80;">
        메일을 받아서 바꾸고 싶으시면
        <a href="#" id="reset" style="font-weight:600;">메일로 링크 받기</a> 를 눌러주세요.
      </div>
    </div>
  </div>

  <div class="note">
    비밀번호는 보안상의 이유로 알려드리는 대신 <b>새 비밀번호를 세팅하실 수 있습니다.</b>
    예전 비번을 다시 넣으셔도 무방합니다.
  </div>

  <div class="foot">비밀번호가 기억나셨나요? <a href="login.html">로그인</a></div>
  <div class="back" style="text-align:center;"><a href="/index.html">← 통합 홈으로</a></div>
</div>

<script type="module">
import { sb, showMsg } from "./auth.js";

let email = "";
const $ = (id) => document.getElementById(id);

$("findForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("btn"), msg = $("msg");
  btn.disabled = true; showMsg(msg, "");
  const { data, error } = await sb.rpc("find_login", {
    p_name: $("name").value.trim(),
    p_phone: $("phone").value.trim(),
  });
  btn.disabled = false;
  if (error) {
    showMsg(msg, /function/.test(error.message)
      ? "준비가 아직 안 되었습니다. 운영진에게 auth/find_login.sql 실행을 부탁해주세요."
      : "찾지 못했습니다: " + error.message);
    return;
  }
  if (!data) {
    showMsg(msg, "이름과 휴대전화가 맞는 회원을 찾지 못했습니다. 가입하실 때 적으신 그대로 넣어주세요.");
    $("found").classList.remove("on");
    return;
  }
  email = data;
  $("foundEmail").textContent = email;
  $("found").classList.add("on");
  showMsg(msg, "");
});

// 그 자리에서 새 비밀번호 정하기 (메일 없이)
$("setpw").addEventListener("click", async () => {
  const btn = $("setpw"), msg = $("msg");
  const a = $("np1").value, b = $("np2").value;
  if (a.length < 6) { showMsg(msg, "비밀번호는 6자 이상으로 넣어주세요."); return; }
  if (a !== b) { showMsg(msg, "두 번 넣으신 비밀번호가 서로 다릅니다."); return; }
  btn.disabled = true; btn.textContent = "바꾸는 중…";
  const { data, error } = await sb.rpc("reset_password", {
    p_name: $("name").value.trim(),
    p_phone: $("phone").value.trim(),
    p_password: a,
  });
  btn.disabled = false; btn.textContent = "이 비밀번호로 바꾸기";
  if (error) {
    showMsg(msg, /function/.test(error.message)
      ? "준비가 아직 안 되었습니다. 운영진에게 auth/find_login.sql 실행을 부탁해주세요."
      : "바꾸지 못했습니다: " + error.message);
    return;
  }
  if (data === "SHORT")    { showMsg(msg, "비밀번호는 6자 이상으로 넣어주세요."); return; }
  if (data === "NOTFOUND") { showMsg(msg, "이름과 휴대전화가 맞는 회원을 찾지 못했습니다."); return; }
  showMsg(msg, "비밀번호를 바꿨습니다. 이제 " + data + " 로 로그인하실 수 있습니다.", true);
  setTimeout(() => location.href = "login.html", 2200);
});

$("reset").addEventListener("click", async (e) => {
  e.preventDefault();
  const btn = $("reset"), msg = $("msg");
  btn.disabled = true; btn.textContent = "보내는 중…";
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + "/OB/auth/reset.html",
  });
  btn.disabled = false; btn.textContent = "메일로 링크 받기";
  if (error) { showMsg(msg, "메일을 보내지 못했습니다: " + error.message); return; }
  showMsg(msg, email + " 으로 비밀번호를 새로 정하는 링크를 보냈습니다. 받은편지함을 확인해주세요.", true);
});
</script>
