  <h1>비밀번호 새로 정하기</h1>
  <p class="desc" id="who">메일의 링크로 들어오셨습니다. 새 비밀번호를 정해주세요.</p>

  <form id="pwForm">
    <label>새 비밀번호 <small style="color:#9a947f;font-weight:400;">(6자 이상 · 쓰시던 것과 같아도 됩니다)</small></label>
    <input type="password" id="pw1" required minlength="6" autocomplete="new-password">
    <label>새 비밀번호 다시 한 번</label>
    <input type="password" id="pw2" required minlength="6" autocomplete="new-password">
    <button class="primary" id="btn" type="submit">비밀번호 바꾸기</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="foot"><a href="login.html">로그인 화면으로</a></div>
  <div class="back" style="text-align:center;"><a href="/index.html">← 통합 홈으로</a></div>
</div>

<script type="module">
import { sb, showMsg, currentUser } from "./auth.js";
const $ = (id) => document.getElementById(id);

// 메일 링크를 눌러 들어오면 잠시 로그인된 상태가 됩니다
const u = await currentUser();
if (!u) {
  $("who").textContent = "메일에 있는 링크로 들어오셔야 비밀번호를 바꾸실 수 있습니다.";
  $("pwForm").style.display = "none";
} else {
  $("who").textContent = (u.email || "") + " 의 새 비밀번호를 정해주세요.";
}

$("pwForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("msg"), btn = $("btn");
  if ($("pw1").value !== $("pw2").value) { showMsg(msg, "두 번 넣으신 비밀번호가 서로 다릅니다."); return; }
  btn.disabled = true;
  const { error } = await sb.auth.updateUser({ password: $("pw1").value });
  btn.disabled = false;
  // 예전과 같은 비밀번호를 넣으셔도 그대로 쓰실 수 있게 넘어간다
  const same = error && (error.code === "same_password"
    || /different from the old password|same.*password/i.test(error.message || ""));
  if (error && !same) { showMsg(msg, "바꾸지 못했습니다: " + error.message); return; }
  showMsg(msg, same
    ? "예전에 쓰시던 비밀번호 그대로 두었습니다. 그대로 로그인하실 수 있습니다."
    : "비밀번호를 바꿨습니다. 잠시 후 홈으로 이동합니다.", true);
  setTimeout(() => location.href = "/index.html", 1800);
});
</script>
