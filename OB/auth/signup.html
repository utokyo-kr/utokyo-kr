  <h1>회원가입</h1>
  <p class="desc">개인정보는 동문회 주소록 업데이트에 필요한 사항이오니, 꼭 작성 부탁드립니다.
    가입신청 후 운영진 승인을 거쳐 회원 전용 콘텐츠를 이용할 수 있습니다.</p>

  <form id="signupForm">
    <label>이름 *</label>
    <input type="text" id="name" required placeholder="홍길동">

    <label>구분 *</label>
    <select id="member_type" required>
      <option value="">선택하세요</option>
      <option value="YB">YB — 재학생 (한국인학생회)</option>
      <option value="OB">OB — 졸업생 (재한 도쿄대학 총동문회)</option>
      <option value="GUEST">비동문 — Guest (도쿄대학 출신이 아닌 분)</option>
    </select>

    <div class="row2" id="schoolBox">
      <div>
        <label>학부/연구과 *</label>
        <input type="text" id="faculty" required placeholder="예: 공학계연구과 도시공학과">
      </div>
      <div>
        <label>졸업(예정)연도 *</label>
        <input type="text" id="grad_year" required placeholder="예: 박2012">
      </div>
    </div>

    <div id="jobBox">
      <label style="margin-bottom:2px;">현재 직장</label>
      <div class="row2">
        <div>
          <input type="text" id="company" placeholder="직장명 — 예: ○○상사 도쿄지점">
        </div>
        <div>
          <input type="text" id="position" placeholder="직급 — 예: 과장">
        </div>
      </div>
    </div>

    <label>전화번호</label>
    <input type="tel" id="phone" placeholder="010-0000-0000">

    <label>이메일 *</label>
    <input type="email" id="email" required placeholder="you@example.com">

    <label>비밀번호 * <span style="font-weight:300;color:#9a947f;">(8자 이상)</span></label>
    <input type="password" id="password" required minlength="8">

    <button class="primary" id="btn" type="submit">가입 신청하기</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="foot">이미 계정이 있으신가요? <a href="login.html">로그인</a></div>
  <div class="back" style="text-align:center;"><a href="/index.html">← 통합 홈으로</a></div>
</div>

<script type="module">
import { sb, showMsg } from "./auth.js";

const form = document.getElementById("signupForm");

// 재학생(YB)에게는 직장·직급을 묻지 않는다
// 비동문(GUEST)은 도쿄대 소속이 아니므로 학부/연구과·졸업연도를 묻지 않는다
const jobBox = document.getElementById("jobBox");
const schoolBox = document.getElementById("schoolBox");
const typeSel = document.getElementById("member_type");
function toggleJob() {
  const yb = typeSel.value === "YB", guest = typeSel.value === "GUEST";
  jobBox.style.display = (yb || guest) ? "none" : "";
  if (yb || guest) { document.getElementById("company").value = ""; document.getElementById("position").value = ""; }
  // 감춘 칸은 「필수」도 함께 풀어야 가입 단추가 먹습니다
  schoolBox.style.display = guest ? "none" : "";
  document.getElementById("faculty").required = !guest;
  document.getElementById("grad_year").required = !guest;
  if (guest) { document.getElementById("faculty").value = ""; document.getElementById("grad_year").value = ""; }
}
typeSel.addEventListener("change", toggleJob);
toggleJob();

const btn = document.getElementById("btn");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  btn.disabled = true;
  const mail = document.getElementById("email").value.trim();

  // 명단에서 빠진 뒤 다시 가입할 수 없게 막아둔 메일인지 먼저 봅니다
  try {
    const blk = await sb.rpc("email_blocked", { p_email: mail });
    if (blk.data === true) {
      btn.disabled = false;
      showMsg(msg, "이 메일 주소로는 다시 가입하실 수 없습니다. 운영진에게 문의해주세요.");
      return;
    }
  } catch (e) { /* 아직 준비 전이면 그냥 넘어갑니다 */ }

  const { error } = await sb.auth.signUp({
    email: mail,
    password: document.getElementById("password").value,
    options: {
      data: {
        name: document.getElementById("name").value.trim(),
        member_type: document.getElementById("member_type").value,
        faculty: document.getElementById("faculty").value.trim(),
        grad_year: document.getElementById("grad_year").value.trim(),
        company: document.getElementById("company").value.trim(),
        job_title: document.getElementById("position").value.trim(),
        phone: document.getElementById("phone").value.trim(),
      },
      emailRedirectTo: "https://u-tokyo.kr/auth/login.html",
    },
  });
  btn.disabled = false;
  if (error) {
    showMsg(msg, /다시 가입|blocked_emails|Database error saving/i.test(error.message || "")
      ? "이 메일 주소로는 다시 가입하실 수 없습니다. 운영진에게 문의해주세요."
      : "가입 실패: " + error.message);
  } else {
    showMsg(msg, "가입 신청 완료! 입력하신 이메일로 인증 메일을 보냈습니다. 메일의 링크를 눌러 인증을 마친 뒤 로그인해주세요.", true);
    form.reset();
  }
});
</script>
